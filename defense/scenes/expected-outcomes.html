<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What would each outcome look like</title>
<!-- the anchor brain's box, shared by every Ch. 1 experiment scene (owned by ch1-experiment) -->
<link rel="stylesheet" href="shared/anchor.css">
<style>
  :root{
    --bg:#ffffff; --ink:#0f172a; --body:#334155; --muted:#64748b;
    --border:#e2e8f0; --panel:#f8fafc;
    --slate:#38506e; --plum:#7a5ea0; --pine:#3f7357; --ochre:#b45309;
    /* the deck is Calibri (deck-font.css is injected by the engine; this is the fallback) */
    --serif:'Deck Calibri', Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif;
    --sans:'Deck Calibri', Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif;
    /* Figure 4's own colors (anchor.json / image10–12), never restyled */
    --r1:#b7cfe8; --r2:#5d8fc7; --r3:#1f3f7a; --floor:#9a9a9a;
    --spec:#e6801e; --std:#2f8a7e; --rob:#6a3fa8; --robE:#b9a3dc; --robL:#4b2386;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--body); font-family:var(--sans);
        overflow:hidden; cursor:pointer; user-select:none; -webkit-user-select:none; }
  #stage{ position:absolute; inset:0; }
  /* the title sits above --anchor-top (contracts/anchor-brain.md); deck title style:
     Calibri Light, clamp(1.8rem,3.5vw,3rem), black (outline/feedback/_deck-wide.md) */
  h1{ position:absolute; left:var(--anchor-left); top:4vh;
      font-family:var(--sans); font-weight:300; color:var(--ink);
      font-size:clamp(1.8rem,3.5vw,3rem); line-height:1.08; letter-spacing:0; }
  h1 em{ font-style:normal; color:var(--ink); }
  #brain, #fig{ position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible; }
  text{ font-family:var(--sans); }
  .tick{ font-size:17px; fill:var(--ink); }
  .ax{ font-size:19px; fill:var(--ink); }
  /* no colored text (Fer, 2026-10-07): words are black; a series' colour is in its swatch */
  .ptitle{ font-size:24px; font-weight:700; fill:var(--ink); }
  .lab{ font-size:21px; font-weight:700; fill:var(--ink); }
  .note{ font-size:18px; fill:var(--ink); }
  .stamp{ font-size:15px; font-weight:700; letter-spacing:.14em; fill:var(--ink); }
  .numeral text{ font-family:var(--sans); font-weight:700; fill:#fff; stroke:#000; stroke-width:9;
                 paint-order:stroke; text-anchor:middle; dominant-baseline:central; }

  [data-step]{ opacity:0; transition:opacity .5s ease; }
  [data-step].shown{ opacity:1; }
  .gone{ opacity:0 !important; transition:opacity .5s ease; }
  /* bands draw in from Region 1 to Region 3 */
  path.draw{ stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset .9s ease; }
  .shown path.draw{ stroke-dashoffset:0; }
  /* the standard band swings once, like the proposal's spin (autoreverse) */
  #dStd.wobble{ animation:dWob 2s ease-in-out; }
  @keyframes dWob{ 0%,100%{transform:rotate(0)} 50%{transform:rotate(24deg)} }
  /* region focus: the regions not in play wash out, on the brain and in the plot */
  .wash, .colhi{ transition:opacity .45s ease; }

  #cap{ position:absolute; left:var(--anchor-left); bottom:4.6vh; max-width:62vw;
        font-size:clamp(15px,1.6vw,23px); font-weight:500; color:var(--ink); line-height:1.3;
        min-height:1.3em; transition:opacity .3s ease; pointer-events:none; }
  #cap.swap{ opacity:0; }
  #dots{ position:absolute; right:2rem; bottom:5vh; display:flex; gap:.42rem; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid #cbd5e1; }
  .dot.on{ background:var(--ink); border-color:var(--ink); }
  #notes{ position:fixed; inset:auto 0 0 0; max-height:52vh; overflow:auto; background:#0f172a;
          color:#e2e8f0; padding:1.5rem 3vw 2rem; font-size:15px; line-height:1.6; display:none; }
  #notes.on{ display:block; }
</style>
</head>
<body>
<div id="stage">
  <h1>What would each outcome <em>look like</em>?</h1>
  <div class="anchor-brain">
    <!-- the anchor brain: the paper's Fig. 4A locator + enlargement (contracts/anchor-brain.md),
         built exactly as in scanning-run.html so the cut between parts is continuous.
         Everything inside #bw is in whole-regions.png pixels; the enlargement re-uses it. -->
    <svg id="brain" viewBox="0 0 1947 2976" preserveAspectRatio="xMidYMid meet">
      <defs>
        <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1947" height="1580"><image href="../assets/outline/anchor/mask-region1.png" width="1947" height="1580"/></mask>
        <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1947" height="1580"><image href="../assets/outline/anchor/mask-region2.png" width="1947" height="1580"/></mask>
        <mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="1947" height="1580"><image href="../assets/outline/anchor/mask-region3.png" width="1947" height="1580"/></mask>
        <clipPath id="zc"><rect x="282" y="876" width="1000" height="686"/></clipPath>
      </defs>
      <g id="bw">
        <image href="../assets/outline/anchor/whole-regions.png" width="1947" height="1580"/>
        <!-- a region out of focus is washed toward the cortex grey; its blue never changes -->
        <rect class="wash" data-r="1" mask="url(#m1)" width="1947" height="1580" fill="#8c8c8c" opacity="0"/>
        <rect class="wash" data-r="2" mask="url(#m2)" width="1947" height="1580" fill="#8c8c8c" opacity="0"/>
        <rect class="wash" data-r="3" mask="url(#m3)" width="1947" height="1580" fill="#8c8c8c" opacity="0"/>
      </g>
      <rect x="282" y="876" width="1000" height="686" fill="none" stroke="#000" stroke-width="6"/>
      <g transform="translate(0 1640) scale(1.947) translate(-282 -876)" clip-path="url(#zc)"><use href="#bw"/></g>
      <g class="numeral" font-size="96">
        <text x="771" y="2029">1</text><text x="1373" y="2364">2</text><text x="629" y="2401">3</text>
      </g>
    </svg>
  </div>
  <div class="anchor-content"><svg id="fig" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="Schematic of expected noise-corrected NSE across three regions, not data"></svg></div>
  <p id="cap"></p>
  <div id="dots"></div>
</div>
<div id="notes"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Expected outcomes: Fer's thesis-proposal slides 26–27 (Feb 2024) redrawn on
// Figure 4's axes (noise-corrected NSE by region; 0 = noise floor). SCHEMATIC,
// NOT DATA: hand-drawn bands, no error bars, an "EXPECTED · NOT DATA" stamp.
// Fer (2026-10-07): Figure 4 colours; the proposal label on the slide; in the
// stage-by-stage beats the other models are removed (mixing them confused).
//
// The anchor brain sits in the left box (contracts/anchor-brain.md). On beats that
// are about particular regions, the others wash toward grey on the brain and their
// column in the plot loses its tint, so each claim points at where in cortex it is.
//
// ACT 0 (0):   the results' axes.
// ACT 1 (1):   spectrotemporal: rises with region (replicates prior work).
// ACT 2 (2-3): standard-trained: highest; swings once (high in Region 1 too?).
// ACT 3 (4):   robust: with spectrotemporal in Region 1, lowest beyond it.
// ACT 4 (5-6): the robust network alone, stage by stage; the late stage could flip.
// ─────────────────────────────────────────────────────────────────────────────
const SLIDE_NAME = 'expectedOutcomes';
const RCOL = ['var(--r1)','var(--r2)','var(--r3)'];

// plot geometry, in the viewBox of .anchor-content's svg
const GX = 110, GY = 70, W = 620, H = 400;
const X = i => GX + W*(0.2 + 0.3*i), Y = v => GY + H*(1 - v);
// column tints, per region so the light and the dark blue read equally strong
const TINT = { base:[.16,.08,.045], focus:[.5,.24,.13] };

function axes(){
  let s = '';
  // a faint column per region, tinted in its blue: it is what washes out on focus beats
  [0,1,2].forEach(i => s += `<rect class="colhi" data-r="${i+1}" x="${X(i)-W*.13}" y="${GY}"
     width="${W*.26}" height="${H}" fill="${RCOL[i]}" opacity="${TINT.base[i]}"/>`);
  s += `<line x1="${GX}" y1="${GY}" x2="${GX}" y2="${GY+H}" stroke="#000" stroke-width="1.4"/>`;
  [0,.5,1].forEach(v => s += `<line x1="${GX-7}" x2="${GX}" y1="${Y(v)}" y2="${Y(v)}" stroke="#000"/>
     <text class="tick" x="${GX-13}" y="${Y(v)+6}" text-anchor="end">${v}</text>`);
  s += `<line x1="${GX}" x2="${GX+W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--floor)" stroke-width="1.4"/>`;
  const by = GY + H + 24;
  s += `<line x1="${GX+W*.07}" x2="${GX+W*.93}" y1="${by-3}" y2="${by-3}" stroke="#000"/>`;
  [0,1,2].forEach(i => s += `<rect x="${X(i)-W*.11}" y="${by}" width="${W*.22}" height="11" fill="${RCOL[i]}"/>
     <text class="tick" x="${X(i)}" y="${by+33}" text-anchor="middle">${i+1}</text>`);
  s += `<text class="ax" x="${X(1)}" y="${by+60}" text-anchor="middle">Region</text>`;
  s += `<text class="ax" transform="translate(${GX-58},${GY+H/2}) rotate(-90)" text-anchor="middle">Noise-corrected NSE</text>`;
  s += `<text class="note" x="${GX}" y="${GY-26}" style="font-style:italic">As predicted at the thesis proposal, Feb 2024</text>`;
  s += `<text class="stamp" x="${GX+W}" y="${GY-26}" text-anchor="end">EXPECTED · NOT DATA</text>`;
  return s;
}
// a series label: a short piece of its band as the colour key, then the name in black
function key(x, y, col, label){
  return `<line x1="${x}" x2="${x+26}" y1="${y}" y2="${y}" stroke="${col}" stroke-opacity=".32"
      stroke-width="14" stroke-linecap="round"/>
    <line x1="${x}" x2="${x+26}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>
    <text class="lab" x="${x+38}" y="${y+7}">${label}</text>`;
}
// a hand-drawn band: wide translucent stroke + a thin core, as in the proposal
function band(vals, col, step, {until=null, id='', label='', ly=null}={}){
  const pts = vals.map((v,i) => [X(i), Y(v)]);
  const d = 'M' + pts.map(p => p.join(',')).join(' L');
  return `<g data-step="${step}" ${until!=null?`data-until="${until}"`:''} ${id?`id="${id}"`:''}>
    <path class="draw" pathLength="1" d="${d}" fill="none" stroke="${col}" stroke-opacity=".32"
      stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="draw" pathLength="1" d="${d}" fill="none" stroke="${col}" stroke-width="3.2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${label ? key(pts[2][0]+30, ly??pts[2][1], col, label) : ''}</g>`;
}

const STD = [.56,.72,.9], SPEC = [.16,.36,.64], ROB = [.15,.18,.24];
const fig = document.getElementById('fig');
fig.innerHTML = axes()
  + `<style>#dStd{ transform-origin:${X(1)}px ${Y(STD[1])}px; }</style>`
  + `<g class="models">`
  +   band(SPEC, 'var(--spec)', 1, {label:'Spectrotemporal'})
  +   band(STD,  'var(--std)',  2, {id:'dStd', label:'Standard-trained'})
  +   band(ROB,  'var(--rob)',  4, {label:'Robust'})
  + `</g>`
  // the robust network alone, stage by stage (proposal slide 27)
  + `<text class="ptitle" data-step="5" x="${GX+24}" y="${Y(.92)}">Robust network, stage by stage</text>`
  + band([.1,.3,.5],    'var(--robE)', 5, {label:'early stage'})
  + band([.2,.21,.22],  'var(--robL)', 5, {until:6, label:'late stage', ly:Y(.22)+4})
  + band([.62,.38,.14], 'var(--robL)', 6, {label:'late stage', ly:Y(.14)+4});

// per beat: caption, and which regions are in focus (null = all three)
const BEATS = [
  {cap:'Same axes as the results: NSE in each region',                          focus:null},
  {cap:'Spectrotemporal: low in primary, rising beyond it, as in prior work',   focus:null},
  {cap:'Standard-trained network: highest',                                     focus:null},
  {cap:'… in non-primary cortex, and perhaps in primary too',                   focus:[1]},
  {cap:'Robust network: with spectrotemporal in Region 1, lowest beyond it',    focus:[2,3]},
  {cap:'The robust network alone: its stages could differ across regions',      focus:null},
  {cap:'… even reverse: a late stage matching non-primary cortex best',         focus:[3]},
];
const NOTES = 'Schematic, not data. These are the predictions from my thesis proposal, redrawn on the axes of the results; the brain on the left shows the three regions. [click] The spectrotemporal model should replicate prior work: low NSE in primary cortex, rising toward non-primary cortex. [click] The standard-trained network should give the largest NSE, [click] certainly in non-primary cortex, and possibly in primary cortex, Region 1, as well. [click] The robust network should match the spectrotemporal model in Region 1 and give the lowest NSE beyond it, in Regions 2 and 3. [click] Now the robust network alone, stage by stage. Different stages could give different profiles: an early stage tracking the spectrotemporal pattern, [click] and a late stage that could even reverse it, matching non-primary cortex, Region 3, better than primary.';
document.getElementById('notes').innerHTML = NOTES;

// Two deck slides from this one scene (Fer, 2026-10-07: new content gets a new number):
//   ?from=0&to=4  the three models compared;   ?from=5&to=6  the robust network alone.
const N = BEATS.length, QS = new URLSearchParams(location.search);
const LO = Math.max(0, Math.min(N-1, +(QS.get('from') || 0)));
const HI = Math.max(LO, Math.min(N-1, QS.get('to') != null ? +QS.get('to') : N-1));
let beat = LO, prevBeat = LO, capTimer = 0;
function render(){
  fig.querySelectorAll('[data-step]').forEach(el =>
    el.classList.toggle('shown', beat >= +el.dataset.step &&
      (el.dataset.until == null || beat < +el.dataset.until)));
  // swing the standard band only when stepping forward into beat 3
  const std = document.getElementById('dStd');
  std.classList.remove('wobble');
  if(beat === 3 && prevBeat === 2){ void std.getBoundingClientRect(); std.classList.add('wobble'); }
  // the stage-by-stage beats show the robust network alone
  fig.querySelector('.models').classList.toggle('gone', beat >= 5);
  // region focus, on the brain and in the plot
  const f = BEATS[beat].focus;
  document.querySelectorAll('.wash').forEach(r =>
    r.setAttribute('opacity', f && !f.includes(+r.dataset.r) ? .72 : 0));
  fig.querySelectorAll('.colhi').forEach(r =>
    r.setAttribute('opacity', !f ? TINT.base[r.dataset.r-1] : f.includes(+r.dataset.r) ? TINT.focus[r.dataset.r-1] : 0));
  prevBeat = beat;
  const cap = document.getElementById('cap');
  cap.classList.add('swap'); clearTimeout(capTimer);
  capTimer = setTimeout(() => { cap.textContent = BEATS[beat].cap; cap.classList.remove('swap'); }, 150);
  document.getElementById('dots').innerHTML = BEATS.slice(LO, HI+1)
    .map((_,i) => `<span class="dot ${LO+i<=beat?'on':''}"></span>`).join('');
}
// getBeat() is the click within THIS deck slide (0 on arrival), for the "slide.click" number
window[SLIDE_NAME] = {
  advance(){ if(beat<HI){ beat++; render(); } },
  back(){ if(beat>LO){ beat--; render(); } },
  atStart(){ return beat<=LO; }, atEnd(){ return beat>=HI; },
  reset(){ prevBeat=beat=LO; render(); }, resetToEnd(){ prevBeat=beat=HI; render(); },
  getBeat(){ return beat - LO; }, count(){ return HI - LO + 1; },
  setBeat(b){ beat=Math.max(LO,Math.min(HI,LO+b)); render(); },
};
// clicks land in the iframe, so the scene owns them; keys are the deck's when embedded
addEventListener('click', e => { if(!e.target.closest('#notes')) window[SLIDE_NAME].advance(); });
if(window.parent === window){
  addEventListener('keydown', e => {
    if(['ArrowRight',' ','Enter'].includes(e.key)) window[SLIDE_NAME].advance();
    else if(e.key === 'ArrowLeft') window[SLIDE_NAME].back();
    else if(e.key === 'n') document.getElementById('notes').classList.toggle('on');
  });
}
render();
</script>
</body>
</html>
