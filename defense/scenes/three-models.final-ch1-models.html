<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The three models tested</title>
<link rel="stylesheet" href="../vendor/fraunces.css">
<style>
  :root{
    --ink:#0f172a; --body:#334155; --muted:#64748b; --border:#e2e8f0; --panel:#f8fafc;
    --blue:#38506e; --purple:#7a5ea0; --green:#3f7357; --amber:#b45309;
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    /* matched-stage colours: the paper's own, read off image2/image5 colour bars */
    --m-power:#e6801e;
    --m-std2:#80cdc1; --m-std3:#35978f; --m-std4:#01665e;
    --m-rob2:#c9b3e6; --m-rob3:#9b6fd1; --m-rob4:#5e2ca5;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:#fff; color:var(--body); font-family:var(--sans); display:flex; flex-direction:column;
        overflow:hidden; cursor:pointer; user-select:none; -webkit-user-select:none; }
  #stage{ flex:1 1 auto; min-height:0; position:relative; }
  #fig, #popSvg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #popSvg{ pointer-events:none; }

  text{ font-family:var(--sans); fill:var(--ink); }
  .title{ font-family:var(--serif); font-weight:900; font-size:58px; letter-spacing:-.5px; }
  .title tspan.em{ fill:var(--blue); }
  .name{ font-size:28px; font-weight:600; }
  .name tspan.sub2{ font-size:22px; font-weight:400; fill:var(--muted); }
  .sub{ font-size:21px; fill:var(--muted); }
  .lab{ font-size:20px; fill:var(--body); text-anchor:middle; }
  .task{ font-size:20px; fill:var(--body); }
  .call{ font-size:30px; fill:var(--ink); }
  .call .hl{ font-weight:700; }
  .call.plum, .call.plum tspan{ fill:var(--purple); }
  .call.small{ font-size:22px; }

  .wire{ fill:none; stroke:#334155; stroke-width:2.4; }
  .arrow{ fill:none; stroke:#334155; stroke-width:2.4; marker-end:url(#ah); }
  .front{ fill:#f4f5f7; stroke:#6b7280; stroke-width:1.5; stroke-linejoin:miter; transition:fill .7s ease; }
  .top{ fill:#eceef1; stroke:#6b7280; stroke-width:1.2; stroke-linejoin:miter; transition:fill .7s ease; }
  .side{ fill:#d9dce1; stroke:#6b7280; stroke-width:1.2; stroke-linejoin:miter; transition:fill .7s ease; }
  .arch{ fill:none; stroke:#9ca3af; stroke-width:1.2; }
  .cell{ pointer-events:none; }
  .route{ fill:none; stroke:#cbd5e1; stroke-width:1.6; }
  .ftile-on{ stroke:#e6801e; stroke-width:2.2; fill:none; }
  .chl{ font-size:17px; fill:var(--muted); text-anchor:middle; }
  .coch{ stroke:#0f172a; stroke-width:2; fill:none; }
  .bracket{ fill:none; stroke:var(--blue); stroke-width:3; stroke-linecap:round; }
  .brlab{ font-size:22px; fill:var(--blue); font-weight:600; text-anchor:end; }

  /* builds: everything with data-step fades in at its beat; --d staggers the
     pieces of one beat so a row comes out piece by piece, left to right */
  [data-step]{ opacity:0; transition:opacity .55s ease, stroke-dashoffset .7s ease, transform .55s ease; }
  [data-step].shown{ opacity:1; transition-delay:var(--d,0s); }
  .draw{ stroke-dasharray:1; stroke-dashoffset:1; }
  .draw.shown{ stroke-dashoffset:0; }
  g.pop-in{ transform:translateY(10px); transform-box:fill-box; }
  g.pop-in.shown{ transform:none; }

  /* emphasis: during the adversarial beat the other two models step back */
  .row{ transition:opacity .6s ease; }
  body[data-focus="rob"] .row:not(.rob){ opacity:.28; }

  /* matched stages: the colour arrives on the matched beat, nowhere earlier */
  body.matched .m .front{ fill:var(--mc); }
  body.matched .m .top{ fill:var(--mc); filter:brightness(.9); }
  body.matched .m .side{ fill:var(--mc); filter:brightness(.75); }
  #dashBox{ fill:none; stroke:#0f172a; stroke-width:2.2; stroke-dasharray:7 5; opacity:0; transition:opacity .3s ease; }
  body.popped #dashBox{ opacity:1; }

  /* one block, opened up */
  #popDim{ fill:#fff; opacity:0; transition:opacity .3s ease; }
  #pop{ opacity:0; transform:translateY(14px); transform-box:fill-box;
        transition:opacity .3s ease, transform .3s ease; }
  body.popped #popDim{ opacity:.8; transition:opacity .5s ease 1.1s; }
  body.popped #pop{ opacity:1; transform:none; transition:opacity .5s ease 1.35s, transform .5s ease 1.35s; }
  .blk{ fill:#fff; stroke:#475569; stroke-width:1.8; }
  .blk.conv{ fill:#eef2f7; }
  .blkt{ font-size:24px; text-anchor:middle; fill:var(--ink); }
  .popt{ font-size:20px; font-weight:700; letter-spacing:2.5px; fill:var(--muted); }
  .popc{ font-size:21px; fill:var(--body); text-anchor:middle; }

  #legend rect{ stroke:#475569; stroke-width:1.2; }

  footer{ flex:0 0 auto; padding:.4rem 2rem 1.1rem; display:flex; justify-content:flex-end; }
  #dots{ display:flex; gap:.45rem; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid #cbd5e1; }
  .dot.on{ background:var(--ink); border-color:var(--ink); }
  #notes{ position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.965);
          border-top:1px solid var(--border); padding:16px 4% 18px; display:none;
          font-size:clamp(13px,1.15vw,16px); line-height:1.6; pointer-events:none; }
  #notes.on{ display:block; }
  #notes b{ color:var(--ink); font-family:var(--serif); }
</style>
</head>
<body>
  <div id="stage">
    <svg id="fig" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    <svg id="popSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="notes"></div>
  </div>
  <footer><div id="dots"></div></footer>
<script>
// ═══ THE THREE MODELS TESTED ═════════════════════════════════════════════════
// The paper's Fig. 1B (assets/outline/image2.png), laid out for a screen and built
// piece by piece. Network geometry is taken from Fer's matplotlib drawing
// (~/Desktop/Thesis_Figures/model_standard.svg) and matches the journal figure:
// stem, then 3 / 4 / 6 / 3 bottleneck blocks (each with its skip arch), avgpool,
// three task outputs. The matched stage is the LAST block of L2, L3 and L4.
//
// ACT 0 — INPUT        (0-2): title alone; sound → cochleagram; "all start from a cochleagram".
// ACT 1 — THE MODELS   (3-4): spectrotemporal; then both networks together. Sound
//                             runs through each as it builds; tasks one at a time.
// ACT 2 — UNDER THE HOOD (5): the camera flies into one block; its parts appear.
// ACT 3 — SAME NETWORK (6):   camera back out; bracket beside the two networks.
// ACT 4 — ROBUST       (7):   sound runs through the robust network only, again and
//                             again; a perturbation symbol hovers at its start and
//                             turns each pulse plum as it passes.
// ACT 5 — MATCHED      (8):   the matched stages take the paper's colours.
//
// COLOUR: blue = the sound and the activity it drives; plum = adversarial;
// orange / teal / purple = matched stages (the paper's own colours).

const SLIDE_NAME = 'threeModels';
const NS = 'http://www.w3.org/2000/svg';
const A = '../assets/outline/';

// ── layout (viewBox units, 1600 × 900) ───────────────────────────────────────
const COCH = {x:150, y:494, w:200, h:128};
const TRUNK_X = 440, Y_IN = 558;
const ROW_Y = {spec:262, std:558, rob:800};
const ROW_X0 = 500;                 // where every model starts
const K = 0.54;                     // drawing scale for the network (SVG units → here)
const BRACKET_X = 1522;
const UNIT = '#2171b5', UNIT_ADV = '#7a5ea0';
// units take their network's colour (the paper's mid tone for each model)
const UNIT_COL = {spec:'#e6801e', std:'#35978f', rob:'#9b6fd1'};

// network geometry, in model_standard.svg units (front width, height, oblique
// depth dx/dy, pitch between blocks); centre line y = 259.05
const SRC = {x0:92.01, y0:259.05, arch:23.59};
const LAYERS = [
  {k:'stem',    x:92.01,   fw:25.06, h:173.20, dx:32.50, dy:26.31, n:1, arch:false},
  {k:'L1',      x:231.31,  fw:14.74, h:154.78, dx:29.41, dy:23.81, n:3, pitch:22.11, ch:'256 ch'},
  {k:'L2',      x:360.29,  fw:20.86, h:109.45, dx:20.80, dy:16.84, n:4, pitch:28.23, ch:'512 ch', m:2},
  {k:'L3',      x:535.85,  fw:29.48, h:77.39,  dx:14.70, dy:11.90, n:6, pitch:36.85, ch:'1024 ch', m:3},
  {k:'L4',      x:819.61,  fw:41.72, h:54.69,  dx:10.40, dy:8.42,  n:3, pitch:49.09, ch:'2048 ch', m:4},
  {k:'avgpool', x:1029.51, fw:8.84,  h:45.70,  dx:9.29,  dy:7.52,  n:1, arch:false},
];
const ARROWS = [[122.76,223.84],[295.96,352.82],[471.52,528.38],[755.28,812.13],[965.18,1022.04]];
const OUT = {x:1101.01, fw:25.06, h:41.27, dx:8.67, dy:7.02, ys:[174.30, 259.05, 343.81], from:1043.5};
const TASKS = ['Word', 'Environmental category', 'Speaker'];

const BEATS = [
  {cap:'The three models tested'},
  {cap:'Sound → cochleagram'},
  {cap:'All start from a cochleagram'},
  {cap:'Spectrotemporal model', loop:'build', rows:['spec']},
  {cap:'Standard-trained and robust networks', loop:'build', rows:['std','rob']},
  {cap:'Under the hood: one block', pop:true},
  {cap:'Same architecture, tasks and training data'},
  {cap:'Robust: trained against adversarial perturbations', loop:'adv', focus:'rob'},
  {cap:'The matched stages', matched:true},
];
const N = BEATS.length;

const SCRIPT = [
  `<b>The three models tested.</b>`,
  `<b>Sound in.</b> Every model starts from the same thing: a 3 s sound, turned into a cochleagram — the sound as the ear's frequency channels see it over time.`,
  `<b>All start from a cochleagram.</b>`,
  `<b>Spectrotemporal model.</b> A bank of filters tuned to different rates of change in time and frequency; each responds to the sound by how well it matches. The filtered signal is squared — its power — and averaged over time.`,
  `<b>Two deep networks.</b> CochResNet50: a stem, then four stages of blocks — 3, 4, 6 and 3 — trained to recognise words, environmental sounds and speakers. One standard-trained, one robust.`,
  `<b>Under the hood.</b> Each block is a bottleneck — 1×1, 3×3 and 1×1 convolutions with batch norm and ReLU, plus an identity shortcut (the arch on top of every block).`,
  `<b>Same network, same job.</b> The two share architecture, tasks and training data — only how they were trained differs.`,
  `<b>Robust training.</b> During training, the robust network also saw adversarial perturbations: small changes to its input, constructed specifically against this model to change its answer, made again and again as it trained.`,
  `<b>Matched stages.</b> The coloured stages are the ones we matched: the spectrotemporal model's power (x²) stage, and the last block of layers 2, 3 and 4 in each network.`,
];

// ── SVG helpers ──────────────────────────────────────────────────────────────
const svg = document.getElementById('fig');
function el(tag, attrs={}, parent=svg, text){
  const e = document.createElementNS(NS, tag);
  for(const [k,v] of Object.entries(attrs)) if(v != null) e.setAttribute(k, v);
  if(text != null) e.textContent = text;
  parent.appendChild(e); return e;
}
// steps below are written from the input's beat; +1 because beat 0 is the title alone
const build = (e, step, d=0) => { e.dataset.step = step + 1; e.style.setProperty('--d', d+'s'); return e; };
const line = (x1,y1,x2,y2,p,step,d) => build(el('path',{d:`M${x1},${y1} L${x2},${y2}`, class:'arrow draw', pathLength:1}, p), step, d);

const defs = el('defs');
defs.innerHTML = `
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="ahAdv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="${UNIT_ADV}"/></marker>
  <pattern id="pertPat" patternUnits="userSpaceOnUse" width="96" height="96">
    <image href="${A}models-pert.png" width="96" height="96"/></pattern>
  ${Object.entries(UNIT_COL).map(([k,c]) => `<radialGradient id="tokGlow-${k}"><stop offset="0" stop-color="${c}" stop-opacity=".95"/>
    <stop offset=".45" stop-color="${c}" stop-opacity=".4"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('')}
  <radialGradient id="tokGlowAdv"><stop offset="0" stop-color="${UNIT_ADV}" stop-opacity=".95"/>
    <stop offset=".45" stop-color="${UNIT_ADV}" stop-opacity=".4"/><stop offset="1" stop-color="${UNIT_ADV}" stop-opacity="0"/></radialGradient>`;

// "units": tiny squares through the block's volume — on the front face and, skewed,
// on the side and top faces — so a block reads as a stack of units, not a slab.
// Each pass lights a fresh, sparse subset of them.
const UNITS = [];                                     // {cells:[{r,w}], cx, row}
function unitGrid(p, x, y, w, h, row, cx, cellPx=8, dx=0, dy=0){
  const col = UNIT_COL[row], cells = [], ins = .12;
  const add = pts => cells.push({r:el('polygon', {points:pts.map(q => q.join(',')).join(' '),
                                                  class:'cell', fill:col, opacity:0}, p), w:0});
  const cols = Math.max(1, Math.round(w/cellPx)), rows = Math.max(1, Math.round(h/cellPx));
  const nd = dx ? Math.max(1, Math.round(Math.hypot(dx, dy)/cellPx)) : 0;
  // a cell spanning [a0,a1]×[b0,b1] of a face given by its corner and two edge vectors, inset
  const cell = (o, e1, e2, a0, a1, b0, b1) => {
    const m = (a0+a1)/2, n = (b0+b1)/2, sh = t => [t, 0];
    const P = (u, v) => [o[0] + e1[0]*u + e2[0]*v, o[1] + e1[1]*u + e2[1]*v];
    const A0 = a0 + (m-a0)*ins*2, A1 = a1 - (a1-m)*ins*2, B0 = b0 + (n-b0)*ins*2, B1 = b1 - (b1-n)*ins*2;
    return [P(A0,B0), P(A1,B0), P(A1,B1), P(A0,B1)];
  };
  for(let i=0; i<cols; i++) for(let j=0; j<rows; j++)          // front
    add(cell([x,y], [w,0], [0,h], i/cols, (i+1)/cols, j/rows, (j+1)/rows));
  for(let i=0; i<nd; i++) for(let j=0; j<rows; j++)            // side
    add(cell([x+w,y], [dx,-dy], [0,h], i/nd, (i+1)/nd, j/rows, (j+1)/rows));
  for(let i=0; i<cols; i++) for(let j=0; j<nd; j++)            // top
    add(cell([x,y], [w,0], [dx,-dy], i/cols, (i+1)/cols, j/nd, (j+1)/nd));
  const u = {cells, cx, row}; UNITS.push(u); return u;
}

// a block: side, top, front (+ skip arch), drawn like the paper's
function block(p, x, yc, fw, h, dx, dy, opt={}){
  const g = el('g', {class:'pop-in'}, p), yt = yc - h/2, yb = yc + h/2;
  el('path', {d:`M${x+fw},${yb} L${x+fw+dx},${yb-dy} L${x+fw+dx},${yt-dy} L${x+fw},${yt} Z`, class:'side'}, g);
  el('path', {d:`M${x},${yt} L${x+fw},${yt} L${x+fw+dx},${yt-dy} L${x+dx},${yt-dy} Z`, class:'top'}, g);
  el('rect', {x, y:yt, width:fw, height:h, class:'front'}, g);
  if(opt.arch) el('path', {d:`M${x},${yt} Q${x+fw/2},${yt-opt.arch} ${x+fw},${yt}`, class:'arch'}, g);
  if(opt.row) unitGrid(g, x, yt, fw, h, opt.row, x + fw/2, opt.cellPx, dx, dy);
  return g;
}

// ── title ────────────────────────────────────────────────────────────────────
el('text', {x:60, y:66, class:'title'}).innerHTML = 'The <tspan class="em">three models</tspan> tested';

// ── input: sound → cochleagram ───────────────────────────────────────────────
{
  const g = el('g');
  const gw = build(el('g', {class:'pop-in'}, g), 0, 0), gc = build(el('g', {class:'pop-in'}, g), 0, .5);
  let d = '', s = 11;
  const rnd = () => (s = (s*9301+49297) % 233280) / 233280;
  for(let x=15; x<=118; x+=2.2){ const a = 8 + 40*rnd()*(0.4+0.6*Math.sin((x-15)/103*Math.PI)); d += `M${x},${Y_IN-a} L${x},${Y_IN+a} `; }
  el('path', {d, stroke:'#0f172a', 'stroke-width':1.6}, gw);
  el('text', {x:66, y:Y_IN+80, class:'lab', style:'font-size:24px'}, gw, 'Sound (3 s)');
  line(124, Y_IN, COCH.x-6, Y_IN, g, 0, .3);
  el('image', {href:A+'models-coch.png', x:COCH.x, y:COCH.y, width:COCH.w, height:COCH.h, preserveAspectRatio:'none'}, gc);
  el('rect', {id:'cochPert', x:COCH.x, y:COCH.y, width:COCH.w, height:COCH.h, fill:'url(#pertPat)', opacity:0}, gc);
  el('rect', {x:COCH.x, y:COCH.y, width:COCH.w, height:COCH.h, class:'coch'}, gc);
  el('rect', {id:'cochAdv', x:COCH.x-4, y:COCH.y-4, width:COCH.w+8, height:COCH.h+8, rx:3, fill:'none', stroke:'#7a5ea0', 'stroke-width':4, opacity:0}, gc);
  el('text', {x:COCH.x+COCH.w/2, y:COCH.y+COCH.h+34, class:'lab', style:'font-size:24px'}, gc, 'Cochleagram');
  const t = build(el('text', {x:COCH.x+COCH.w/2, y:COCH.y+COCH.h+94, class:'call', 'text-anchor':'middle'}), 1);
  t.innerHTML = `<tspan x="${COCH.x+COCH.w/2}">All start from a</tspan><tspan x="${COCH.x+COCH.w/2}" dy="38" class="hl">cochleagram</tspan>`;
}

// Very faint route lines from the cochleagram (no arrowheads): enough to show where
// the travelling pulses go without spending ink on it.
for(const [k,y] of Object.entries(ROW_Y)){
  const d = `M${COCH.x+COCH.w},${Y_IN} L${TRUNK_X},${Y_IN} L${TRUNK_X},${y} L${ROW_X0-6},${y}`;
  build(el('path', {d, class:'route draw', pathLength:1}), {spec:2, std:3, rob:3}[k], 0);
}

const ROWS = {};
const TL = {};          // row → [[seconds into its build beat, x]] — the pulse follows this
const nameAt = (p, y, name, sub, step) => {
  const t = build(el('text', {x:ROW_X0, y, class:'name'}, p), step, .2);
  t.innerHTML = name + (sub ? `<tspan class="sub2">  ·  ${sub}</tspan>` : '');
};

// ── spectrotemporal model ────────────────────────────────────────────────────
// Geometry from Fer's model_spectemp.svg (centre line y = 261.2), stages as in her
// detailed architecture figure: cochleagram input → spectro-temporal filter bank
// (110 filters; 12 shown, the real ones, sliced from the image embedded in that SVG
// into assets/outline/filters/) → filtered signal → power (x², the matched stage) →
// temporal average. Only the filters carry activity: each lights by how strongly it
// responds, a few strongly, most barely.
{
  const k = 'spec', y = ROW_Y[k], step = 2, g = el('g', {class:'row spec'}), KS = 0.85;
  const SX = x => ROW_X0 + (x - 245.1)*KS, SY = v => y + (v - 261.2)*KS;
  nameAt(g, y - 108, 'Spectrotemporal model', null, step);
  const STAGES = [   // front x0, x1, top, bottom, depth dx, dy (SVG units)
    {k:'in',  x0:245.1, x1:256.7, t:175.7, b:346.6, dx:32.1, dy:26.0, d:.45},
    {k:'fb',  x0:329.4, x1:453.1, t:170.3, b:352.1, dx:16.8, dy:13.6, d:.75},
    {k:'filt',  x0:525.8, x1:547.6, t:175.7, b:346.6, dx:31.2, dy:25.2, d:1.05, lab:['Filtered', 'signal']},
    {k:'power', x0:620.4, x1:653.8, t:175.7, b:346.6, dx:4.3,  dy:3.5,  d:1.3,  lab:['Power', '(x²)'], m:true},
    {k:'avg',   x0:719.3, x1:744.0, t:240.8, b:281.5, dx:8.6,  dy:6.9,  d:1.55, lab:['Temporal', 'average'], labY:346.6},
  ];
  const AR = [[262.3,322.0],[458.7,518.4],[553.3,613.0],[659.5,713.6]];
  TL[k] = [];
  STAGES.forEach((S, i) => {
    if(i) line(SX(AR[i-1][0]), y, SX(AR[i-1][1]), y, g, step, S.d - .12);
    const fw = (S.x1 - S.x0)*KS, h = (S.b - S.t)*KS, cy = SY((S.t + S.b)/2);
    const bg = build(block(g, SX(S.x0), cy, fw, h, S.dx*KS, S.dy*KS), step, S.d);
    if(S.m){ bg.classList.add('m'); bg.style.setProperty('--mc', 'var(--m-power)'); }
    TL[k].push([S.d, SX(S.x0) + fw/2]);
    if(S.k === 'fb'){                                  // the filters, on the front face
      const tiles = [], cols = [336.7, 374.2, 411.6], rows = [177.5, 220.2, 262.8, 305.5], tw = 34.2, th = 39.3;
      rows.forEach((ry, r) => cols.forEach((cx, c) => {
        const tx = SX(cx), ty = SY(ry), href = `${A}filters/f${r}${c}.png`;
        el('image', {href, x:tx, y:ty, width:tw*KS, height:th*KS, preserveAspectRatio:'none', opacity:.4}, bg);
        const on = el('g', {class:'cell', opacity:0}, bg);
        // the filters are thin marks on pale tiles; a warm backing makes "this one responded" readable
        el('rect', {x:tx, y:ty, width:tw*KS, height:th*KS, fill:'#f6c48f'}, on);
        el('image', {href, x:tx, y:ty, width:tw*KS, height:th*KS, preserveAspectRatio:'none', style:'mix-blend-mode:multiply'}, on);
        tiles.push({r:on, w:0});
      }));
      UNITS.push({cells:tiles, cx:SX(S.x0) + fw/2, row:k, filters:true});
      const t = build(el('text', {x:SX(S.x0) + fw/2, y:SY(S.b) + 30, class:'lab'}, g), step, S.d + .1);
      t.innerHTML = `<tspan x="${SX(S.x0) + fw/2}">Filter bank</tspan><tspan x="${SX(S.x0) + fw/2}" dy="20" class="chl">110 filters</tspan>`;
    }
    if(S.lab){ const lx = SX(S.x0) + fw/2 + S.dx*KS/2;
      const t = build(el('text', {x:lx, y:SY(S.labY || S.b) + 30, class:'lab'}, g), step, S.d + .1);
      t.innerHTML = S.lab.map((l, i) => `<tspan x="${lx}" dy="${i ? 20 : 0}">${l}</tspan>`).join(''); }
  });
  ROWS[k] = {g, y, end:SX(744)};
}

// ── the two networks ─────────────────────────────────────────────────────────
const X = x => ROW_X0 + (x - SRC.x0)*K;
function network(k, step, name, mpre){
  const y = ROW_Y[k], g = el('g', {class:'row '+k});
  nameAt(g, y - 78, name, 'CochResNet50', step);
  const Yy = v => y + (v - SRC.y0)*K;
  let d = .45; TL[k] = [];
  LAYERS.forEach((L, li) => {
    if(li) line(X(ARROWS[li-1][0]), y, X(ARROWS[li-1][1]), y, g, step, d - .08);
    for(let i=0; i<L.n; i++){
      const bx = X(L.x + i*(L.pitch||0));
      const bg = build(block(g, bx, y, L.fw*K, L.h*K, L.dx*K, L.dy*K,
                             {arch: L.arch === false ? 0 : SRC.arch*K, row:k}), step, d);
      TL[k].push([d, bx + L.fw*K/2]);
      if(L.m && i === L.n-1){ bg.classList.add('m'); bg.style.setProperty('--mc', `var(--m-${mpre}${L.m})`); }
      if(L.k === 'L4' && i === 0 && k === 'std') ROWS.popFrom = {x:bx, y, w:L.fw*K + L.dx*K, h:L.h*K + L.dy*K + SRC.arch*K};
      d += .07;
    }
    d += .12;
  });
  OUT.ys.forEach((oy, i) => {
    build(el('path', {d:`M${X(OUT.from)},${y} L${X(OUT.x)-4},${Yy(oy)}`, class:'arrow draw', pathLength:1}, g), step, d);
    build(block(g, X(OUT.x), Yy(oy), OUT.fw*K, OUT.h*K, OUT.dx*K, OUT.dy*K), step, d + .1);
    build(el('text', {x:X(OUT.x) + (OUT.fw+OUT.dx)*K + 12, y:Yy(oy)+8, class:'task'}, g, TASKS[i]), step, d + .2);
    d += .55;                                       // the three tasks arrive one at a time
  });
  ROWS[k] = {g, y, end:X(OUT.from)};
}
network('std', 3, 'Standard-trained network', 'std');
network('rob', 3, 'Robust network', 'rob');
// stage names (and widths) once, under the robust row, as in the paper
LAYERS.forEach((L, i) => {
  const cx = X(L.x + ((L.n-1)*(L.pitch||0) + L.fw + L.dx)/2);
  build(el('text', {x:cx, y:ROW_Y.rob + 72, class:'lab'}, ROWS.rob.g, L.k), 3, 1.6 + i*.08);
  if(L.ch) build(el('text', {x:cx, y:ROW_Y.rob + 90, class:'chl'}, ROWS.rob.g, L.ch), 3, 1.7 + i*.08);
});

// ── bracket beside the two networks ──────────────────────────────────────────
{
  const y0 = ROW_Y.std - 70, y1 = ROW_Y.rob + 70, ym = (y0+y1)/2, x = BRACKET_X, c = 16;
  build(el('path', {d:`M${x},${y0} q${c},0 ${c},${c} L${x+c},${ym-c} q0,${c} ${c},${c} q-${c},0 -${c},${c} L${x+c},${y1-c} q0,${c} -${c},${c}`,
                    class:'bracket draw', pathLength:1}), 5, .9);
  const t = build(el('text', {x:x-12, y:ym-6, class:'brlab'}), 5, 1.3);
  t.innerHTML = `<tspan x="${x-12}">Same architecture, tasks</tspan><tspan x="${x-12}" dy="28">and training data</tspan>`;
}

// ── travelling pulses ────────────────────────────────────────────────────────
const tokens = {};
for(const k of ['spec','std','rob']) tokens[k] = el('circle', {r:22, fill:`url(#tokGlow-${k})`, opacity:0});
const advTok = el('g', {opacity:0});
el('circle', {r:26, fill:'url(#tokGlowAdv)'}, advTok);

// ── the adversarial perturbation: on the route itself, between the cochleagram
// and the robust network. Every pulse on its way to the robust network passes
// through it and comes out plum. Label right beside it, so the two read as one.
const PERT_X = TRUNK_X, PERT_Y = 650;
const pertSym = build(el('g', {}), 6, 0);
const pertBob = el('g', {}, pertSym);
el('circle', {cx:PERT_X, cy:PERT_Y, r:44, fill:UNIT_ADV, opacity:.16, class:'pertHalo'}, pertBob);
el('circle', {cx:PERT_X, cy:PERT_Y, r:30, fill:UNIT_ADV}, pertBob);
el('text', {x:PERT_X, y:PERT_Y + 10, 'text-anchor':'middle', style:'font-size:29px; font-weight:700; fill:#fff'}, pertBob, '+δ');
{
  const t = build(el('text', {x:PERT_X + 50, y:PERT_Y - 4, class:'call plum'}), 6, .25);
  t.innerHTML = `<tspan class="hl">+ adversarial perturbations</tspan>`
              + `<tspan x="${PERT_X + 50}" dy="30" style="font-size:21px">added to the cochleagram, crafted against this model</tspan>`;
}
const pastPert = xy => xy[0] >= PERT_X - .5 && xy[1] >= PERT_Y;
// Each cycle: this arrow draws from +δ to the cochleagram, the perturbation lands on
// it, and only then does the (now perturbed) input travel to the robust network —
// the perturbation is added to the input, not to the network.
const pertArrow = el('path', {d:`M${PERT_X - 30},${PERT_Y - 8} C${PERT_X - 70},${PERT_Y - 10} ${COCH.x + COCH.w - 10},${COCH.y + COCH.h + 60} ${COCH.x + COCH.w - 24},${COCH.y + COCH.h + 8}`,
  fill:'none', stroke:UNIT_ADV, 'stroke-width':3.2, 'stroke-linecap':'round', 'marker-end':'url(#ahAdv)',
  pathLength:1, 'stroke-dasharray':1, 'stroke-dashoffset':1, opacity:0});

// ── legend (matched beat) ────────────────────────────────────────────────────
{
  const g = build(el('g', {id:'legend'}), 7, .3);
  ['--m-power','--m-std3','--m-rob3'].forEach((c, i) => el('rect', {x:1180 + i*34, y:ROW_Y.spec-16, width:30, height:30, style:`fill:var(${c})`}, g));
  el('text', {x:1292, y:ROW_Y.spec+8, style:'font-size:26px'}, g, 'Matched stage');
}

// ── one block, opened up: the camera frames the first block of L4 in the upper
// part of the screen, the rest washes out around it, and the block's insides
// open below it with callout lines back to the block (a magnifier).
const popSvg = document.getElementById('popSvg');
const VB_FULL = [0, 0, 1600, 900];
const VB_BLOCK = (() => { const f = ROWS.popFrom, h = f.h*5.2, w = h*16/9;
  return [f.x + f.w/2 - w/2, f.y + h*.2 - h/2, w, h]; })();
{
  const f = ROWS.popFrom;
  el('rect', {id:'dashBox', x:f.x-6, y:f.y - f.h/2 - 14, width:f.w+12, height:f.h+20, rx:3, 'vector-effect':'non-scaling-stroke'});
}
// the block's box on screen once the camera has arrived
const BLK = (() => { const f = ROWS.popFrom, [vx, vy, vw, vh] = VB_BLOCK;
  const sx = x => (x - vx)/vw*1600, sy = y => (y - vy)/vh*900;
  return {x0:sx(f.x-6), x1:sx(f.x+f.w+6), y0:sy(f.y - f.h/2 - 14), y1:sy(f.y + f.h/2 + 6)}; })();
el('defs', {}, popSvg).innerHTML = `<mask id="popHole" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="7600" height="6900"><rect x="-3000" y="-3000" width="7600" height="6900" fill="#fff"/>
  <rect x="${BLK.x0-14}" y="${BLK.y0-14}" width="${BLK.x1-BLK.x0+28}" height="${BLK.y1-BLK.y0+28}" rx="12" fill="#000"/></mask>`;
// oversized, so the wash also covers what shows outside 16:9 on other window shapes
el('rect', {id:'popDim', x:-3000, y:-3000, width:7600, height:6900, mask:'url(#popHole)'}, popSvg);
const pop = el('g', {id:'pop'}, popSvg);
{
  const P = {x:150, y:500, w:1300, h:270};
  // magnifier lines: block corners → panel corners
  [[BLK.x0, P.x + 18], [BLK.x1, P.x + P.w - 18]].forEach(([bx, px]) =>
    el('path', {d:`M${bx},${BLK.y1 + 4} L${px},${P.y}`, fill:'none', stroke:'#0f172a', 'stroke-width':1.6, 'stroke-dasharray':'6 5', opacity:.55}, pop));
  el('rect', {x:P.x, y:P.y, width:P.w, height:P.h, rx:16, fill:'#fff', stroke:'#0f172a', 'stroke-width':2.5,
              style:'filter:drop-shadow(0 14px 28px rgba(15,23,42,.18))'}, pop);
  el('text', {x:P.x+34, y:P.y+48, class:'popt'}, pop, 'INSIDE ONE BLOCK');
  const parts = [['1×1 conv',112,1],['BN',62],['ReLU',78],['3×3 conv',112,1],['BN',62],['ReLU',78],['1×1 conv',112,1],['BN',62],['+',0],['ReLU',78]];
  let x = P.x + 70; const y = P.y + 150, gap = 28; let plusX = 0;
  el('path', {d:`M${x-46},${y} L${x-6},${y}`, class:'arrow'}, pop);
  const startX = x - 30;
  parts.forEach(([t, w, conv], i) => {
    if(t === '+'){
      plusX = x + 16;
      el('circle', {cx:plusX, cy:y, r:16, fill:'#fff', stroke:'#475569', 'stroke-width':1.8}, pop);
      el('text', {x:plusX, y:y+8, class:'blkt'}, pop, '+');
      x += 32;
    } else {
      el('rect', {x, y:y-26, width:w, height:52, rx:6, class:'blk' + (conv ? ' conv' : '')}, pop);
      el('text', {x:x+w/2, y:y+8, class:'blkt'}, pop, t);
      x += w;
    }
    if(i < parts.length-1) el('path', {d:`M${x+3},${y} L${x+gap-4},${y}`, class:'arrow'}, pop);
    x += gap;
  });
  el('path', {d:`M${startX},${y} L${startX},${y-70} L${plusX},${y-70} L${plusX},${y-20}`, fill:'none', stroke:'#475569',
              'stroke-width':2, 'stroke-dasharray':'7 6', 'marker-end':'url(#ah)'}, pop);
  el('text', {x:(startX+plusX)/2, y:y-80, class:'popc', style:'font-style:italic'}, pop, 'identity — the arch on every block');
  el('text', {x:P.x+P.w/2, y:P.y+P.h-34, class:'popc'}, pop, '3, 4, 6 and 3 blocks per stage · stem = 7×7 conv + max pool');
}

// ── camera: the whole figure's viewBox, eased ────────────────────────────────
let vb = VB_FULL.slice(), vbT = VB_FULL.slice(), lastNow = performance.now();

// ── state ────────────────────────────────────────────────────────────────────
let beat = 0, beatT0 = performance.now();
const dotsEl = document.getElementById('dots'), notesEl = document.getElementById('notes');
for(let i=0; i<N; i++){ const d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d); }
const stepped = [...svg.querySelectorAll('[data-step]')];

function render(jumped, snapCam){
  const b = BEATS[beat];
  // Only the beat just entered animates (with its stagger). Everything else —
  // earlier beats still mid-build after fast clicking, steps back, jumps — snaps
  // to its end state, so skipping ahead never leaves a half-built figure.
  stepped.forEach(e => {
    const st = +e.dataset.step;
    e.style.transition = (jumped || st !== beat) ? 'none' : '';
    e.classList.toggle('shown', beat >= st);
  });
  void svg.getBoundingClientRect();
  requestAnimationFrame(() => stepped.forEach(e => { if(e.style.transition === 'none') e.style.transition = ''; }));
  document.body.classList.toggle('popped', !!b.pop);
  document.body.classList.toggle('matched', !!b.matched);
  document.body.dataset.focus = b.focus || '';
  vbT = (b.pop ? VB_BLOCK : VB_FULL).slice();
  if(snapCam) vb = vbT.slice();                   // deck jumps land; clicks and steps back fly
  [...dotsEl.children].forEach((d,i) => d.classList.toggle('on', i <= beat));
  notesEl.innerHTML = SCRIPT[beat];
  beatT0 = performance.now();
}
function advance(){ if(beat < N-1){ beat++; render(false); } }
function back(){ if(beat > 0){ beat--; render(true); } }
function jump(i){ beat = Math.max(0, Math.min(N-1, i)); render(true, true); }
window[SLIDE_NAME] = { advance, back, atStart:() => beat === 0, atEnd:() => beat === N-1,
                       reset:() => jump(0), resetToEnd:() => jump(N-1) };
addEventListener('click', advance);
addEventListener('keydown', e => {
  if(['ArrowRight',' ','Enter'].includes(e.key)){ e.preventDefault(); advance(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); back(); }
  else if(e.key === 'n' || e.key === 'N') notesEl.classList.toggle('on');
  else if(e.key === 'r' || e.key === 'R') jump(0);
});

// ── the loops ────────────────────────────────────────────────────────────────
// Functions of time since the beat began; nothing accumulates, so a jump is safe.
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
function along(y, u, xEnd){                      // cochleagram → trunk → row → xEnd
  const x0 = COCH.x + COCH.w, s1 = TRUNK_X - x0, s2 = Math.abs(y - Y_IN), s3 = xEnd - TRUNK_X;
  let s = u*(s1 + s2 + s3);
  if(s < s1) return [x0 + s, Y_IN];
  s -= s1;
  if(s < s2) return [TRUNK_X, Y_IN + Math.sign(y - Y_IN)*s];
  return [TRUNK_X + (s - s2), y];
}
// a unit lights as the pulse reaches its block, then fades behind it
const actAt = (tokX, cx) => tokX < cx - 10 ? 0 : Math.exp(-(tokX - cx)/340);
// each pass draws a fresh, sparse pattern of which units respond and how much
function reroll(rowFilter){
  UNITS.forEach(u => { if(!rowFilter || u.row === rowFilter) u.cells.forEach(c => {
    c.w = u.filters ? (Math.random() < .3 ? .55 + .45*Math.random() : .12*Math.random())
                    : (Math.random() < .22 ? 0 : Math.pow(Math.random(), 1.1)); }); });
}
function setUnitColor(row, col){ UNITS.forEach(u => { if(u.row === row) u.cells.forEach(c => c.r.setAttribute('fill', col)); }); }

let lastCycle = -1, lastLoop = null, pertShift = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastNow)/1000); lastNow = now;
  // the camera eases in log-scale so the zoom feels even, in and out
  const kz = 1 - Math.exp(-dt*3.4);
  const lw = Math.log(vb[2]) + (Math.log(vbT[2]) - Math.log(vb[2]))*kz, nw = Math.exp(lw);
  const fz = (vb[2] - vbT[2]) ? (vb[2] - nw)/(vb[2] - vbT[2]) : 1;
  for(let i=0; i<4; i++) vb[i] += (vbT[i] - vb[i])*(i === 2 ? fz : fz);
  vb[2] = nw; vb[3] = nw*9/16;
  svg.setAttribute('viewBox', vb.map(v => v.toFixed(2)).join(' '));
  const b = BEATS[beat], t = (now - beatT0)/1000;
  const P = b.loop === 'adv' ? 4.2 : 3.4, cyc = Math.floor(t / P), ph = (t % P)/P;
  if(b.loop !== lastLoop){ lastLoop = b.loop; lastCycle = -1; }
  if(b.loop && cyc !== lastCycle){ lastCycle = cyc; reroll(b.loop === 'adv' ? 'rob' : null); pertShift = (pertShift + 37) % 96; }

  // which rows carry a pulse, and where it is
  const pulse = {};
  if(b.loop === 'run'){ const u = ease(clamp01(ph/.82)), fade = ph > .9 ? (1-ph)/.1 : 1;
    for(const k of ['spec','std','rob']){ const r = ROWS[k]; pulse[k] = {xy:along(r.y, u, r.end), fade}; } }
  if(b.loop === 'build') for(const k of b.rows){
    const r = ROWS[k], tl = TL[k], last = tl[tl.length-1];
    let xy;
    if(t < tl[0][0]) xy = along(r.y, t/tl[0][0], tl[0][1]);           // cochleagram → first block
    else if(t < last[0]){ let i = 0; while(tl[i+1][0] <= t) i++;      // block to block, on cue
      const f = (t - tl[i][0])/(tl[i+1][0] - tl[i][0]); xy = [tl[i][1] + (tl[i+1][1] - tl[i][1])*f, r.y]; }
    else xy = [last[1] + (r.end - last[1])*clamp01((t - last[0])/.35), r.y];
    pulse[k] = {xy, fade: t < last[0] + .35 ? 1 : clamp01(1 - (t - last[0] - .35)/.45)};
  }
  if(b.loop === 'adv'){ const u = ease(clamp01((ph - .3)/.6)), fade = ph < .3 ? 0 : ph > .92 ? (1-ph)/.08 : 1;
    pulse.rob = {xy:along(ROWS.rob.y, u, ROWS.rob.end), fade}; }

  for(const k of ['spec','std','rob']){
    const p = pulse[k], tok = tokens[k];
    const plain = b.loop === 'run' || b.loop === 'build';
    if(p && plain){ tok.setAttribute('cx', p.xy[0]); tok.setAttribute('cy', p.xy[1]); tok.setAttribute('opacity', p.fade); }
    else tok.setAttribute('opacity', 0);
  }
  if(b.loop === 'adv'){ const p = pulse.rob;
    advTok.setAttribute('transform', `translate(${p.xy[0]},${p.xy[1]})`); advTok.setAttribute('opacity', p.fade); }
  else advTok.setAttribute('opacity', 0);
  pertBob.setAttribute('transform', `translate(0,${(Math.sin(now/420)*4).toFixed(2)})`);
  pertBob.querySelector('.pertHalo').setAttribute('r', (40 + 6*Math.sin(now/300)).toFixed(1));

  UNITS.forEach(u => {
    const p = pulse[u.row], a = p ? actAt(p.xy[0], u.cx) * p.fade : 0;
    u.cells.forEach(c => c.r.setAttribute('opacity', Math.min(1, a * c.w * 1.25).toFixed(3)));
  });

  // the perturbation sits on the cochleagram itself, new each cycle
  const cp = document.getElementById('cochPert');
  const ca = document.getElementById('cochAdv');
  if(b.loop === 'adv'){
    const end = ph > .92 ? (1-ph)/.08 : 1;
    pertArrow.setAttribute('opacity', end.toFixed(3));
    pertArrow.setAttribute('stroke-dashoffset', (1 - ease(clamp01(ph/.22))).toFixed(3));
    const land = clamp01((ph - .18)/.14) * end;
    document.getElementById('pertPat').setAttribute('patternTransform', `translate(${pertShift},${(pertShift*1.7)%96})`);
    cp.setAttribute('opacity', (.75*land).toFixed(3));
    ca.setAttribute('opacity', land.toFixed(3));
  } else { cp.setAttribute('opacity', 0); ca.setAttribute('opacity', 0); pertArrow.setAttribute('opacity', 0); }
}

render(true, true);
requestAnimationFrame(frame);
</script>
</body>
</html>
