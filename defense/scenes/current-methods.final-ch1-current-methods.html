<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparing models with brain responses</title>
<style>
  /* Owned by part ch1-current-methods. Mirrors the deck's static-slide chrome
     (deck.css .stage / h1.t / ul.frag / .cite) so it reads as a deck slide. */
  :root{
    --ink:#0f172a; --body:#334155; --muted:#64748b; --border:#e2e8f0; --faint:#cbd5e1;
    --slate:#38506e; --plum:#7a5ea0; --pine:#3f7357; --ochre:#b45309;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#fff; color:var(--body); font-family:var(--sans);
             font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
             cursor:pointer; user-select:none; -webkit-user-select:none; }
  .stage{ position:absolute; inset:0; padding:9vh 6vw 11vh; display:flex; flex-direction:column; }
  h1.t{ font-weight:300; color:var(--ink);
        font-size:clamp(1.8rem, 3.5vw, 3rem); line-height:1.05; letter-spacing:0; margin-bottom:1rem; }
  h1.t em{ font-style:normal; color:var(--ink); }
  #fig{ flex:1 1 auto; min-height:0; width:100%; display:block; overflow:hidden; }

  .cite{ position:absolute; left:6vw; right:8vw; bottom:5.2vh; font-size:1rem; color:var(--ink); }
  /* the first half's lines (c1) give way to the second half's (c2) at beat 5 */
  body:not(.half2) .c2, body.half2 .c1{ display:none !important; }

  .b{ opacity:0; transform:translateY(12px); transition:opacity .45s ease, transform .45s ease; }
  .b.shown{ opacity:1; transform:none; }

  /* ── figure ─────────────────────────────────────────────────────────────── */
  svg text{ font-family:var(--sans); }
  .lab{ font-size:17px; fill:var(--ink); transition:fill .4s ease, font-weight .4s; }
  .hd{ font-size:15px; fill:var(--ink); font-weight:600; letter-spacing:.02em; }
  .ph{ font-size:22px; fill:var(--ink); font-weight:700; }
  .ax{ font-size:14px; fill:var(--ink); }
  .rv{ font-size:18px; font-weight:700; }
  .panel{ transition:opacity .5s ease; }
  .panel.dim{ opacity:.34; }
  /* an element with data-on appears at that beat; with data-off it leaves at that beat */
  .on{ opacity:0; transition:opacity .45s ease; transition-delay:var(--d,0s); }
  .on.shown{ opacity:1; }
  .cell{ transition:opacity .35s ease, fill .5s ease; transition-delay:var(--d,0s); }
  .act.ignored .cell{ fill:#d7dde5; }
  .w .cell{ fill:var(--ink); }
  .w.ignored .cell{ fill:#fff; stroke:var(--faint); stroke-dasharray:3 3; }
  .rowhi{ fill:none; stroke:var(--pine); stroke-width:2.5; opacity:0; transition:opacity .4s ease; transition-delay:var(--d,0s); }
  .rowhi.shown{ opacity:1; }
  body.natural .lab.snd, body.natural .hd.snd{ font-weight:700; }
  /* beat 0: the paper's panel A, whole; beat 1: zoom into its activation matrix, which hands off
     to the schematic matrix (#main). CSS transforms in viewBox units. */
  #main{ transition:opacity .5s ease .6s; }
  body.panelA #main{ opacity:0; transition-delay:0s; }
  #panelA{ transform-box:view-box; transform-origin:0 0; transition:transform .9s cubic-bezier(.4,0,.2,1), opacity .4s ease .8s; }
  body.panelA #panelA{ transition:transform .9s cubic-bezier(.4,0,.2,1), opacity .3s ease; }
  .pacov{ transition:opacity .45s ease; }
  .cite{ transition:opacity .45s ease; }
  body.titleonly .cite{ opacity:0; }
  body.settling *{ transition:none !important; }

  footer{ position:absolute; right:2rem; bottom:1.1rem; }
  #dots{ display:flex; gap:.45rem; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid #cbd5e1; }
  .dot.on2{ background:var(--ink); border-color:var(--ink); }
  #notes{ position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.965);
          border-top:1px solid var(--border); padding:16px 4% 18px; display:none;
          font-size:clamp(13px,1.15vw,16px); line-height:1.6; pointer-events:none; }
  #notes.on{ display:block; }
  #notes b{ color:var(--ink); }
</style>
</head>
<body>
  <div class="stage">
    <h1 class="t" id="title"></h1>
    <svg id="fig" viewBox="0 0 1200 430" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="cite c1">Yamins et al. (2014); Kell et al. (2018); Schrimpf et al. (2018); Tuckute et al. (2023); Kriegeskorte et al. (2008)</div>
  <div class="cite c2">Naselaris et al. (2011); Tuckute et al. (2023); Conwell et al. (2024); Schrimpf et al. (2018); Feather et al. (2023), Fig. 7b; Norman-Haignere &amp; McDermott (2018)</div>
  <footer><div id="dots"></div></footer>
  <div id="notes"></div>
<script>
// ═══ HOW MODELS ARE COMPARED TO CORTEX TODAY → WHY NATURAL STIMULI ARE NOT ENOUGH ═══
// Pattern B (SVG step reveal), schematic toy data. One continuous scene (Fer,
// 2026-10-07): it used to be two slides split by ?from=&to=, but publish.py
// rewrites scene queries to ?v=N, so the push played every beat on both slides.
// Round 4 (2026-10-08): no bullets; everything said is in SCRIPT, one passage per beat.
//
// ACT 0 — TITLE       (0):     the title alone (deck rule, round 6).
// ACT 1 — PANEL A     (1-6):   the paper's Fig. 5A, one component per click: voxel → v;
//                              activations to natural sounds; ridge regression; weights w;
//                              held-out activations × w → predicted; measured, NSE / R².
// ACT 2 — REGRESSION  (7-9):   zoom into panel A's matrix; its top-left 8 × 10 cells become the
//                              schematic (same colours, same place), labelled by sound; weights,
//                              predicted, measured + scatter. (Schematic beat = overall beat − 6.)
// ACT 3 — RSA         (10):    sound × sound dissimilarity for model and region, compared.
// ACT 4 — THE GAP     (11-12): natural sounds co-vary; weights ignore some features.
//                              The title switches at 11.
// ACT 5 — BENCHMARKS  (13-14): Feather et al. 2023 Fig. 7b (Brain-Score IT, a vision
//                              result; real data, cropped, never redrawn); hand-off to
//                              model-matched stimuli (the next part, ch1-mms-logic).
//
// COLOUR: matrices and voxel columns are viridis, styled after the paper's Fig. 3A
// (assets/outline/image14.png: viridis activations, bracketed voxel vectors, the
// network with its red stage, the × w node). All words are black (deck rule, 2026-10-07 round 2);
// ink = fitted weights; pine = the conclusion. Plum is kept free: in this talk it
// means model-matched, which arrives on the next slide.
(function(){
  'use strict';
  const SLIDE_NAME = 'currentMethods';
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('fig');

  // ── toy data (seeded, so every load draws the same figure) ─────────────────
  let seed = 11;
  const rnd = () => (seed = (seed*1103515245 + 12345) % 2147483648) / 2147483648;
  const SOUNDS = ['speech','dog bark','piano','rain','siren','laughter','guitar','footsteps'];
  const NR = SOUNDS.length, NU = 10;
  // The activation block IS the top-left 8 × 10 cells of panel A's matrix (Fer, 2026-10-08:
  // one continuous object through the zoom). Colours are the exact pixels at each cell centre of
  // fig5a-regression-voxel.png (cell runs found with PIL); values are their nearest viridis t,
  // used only for the toy regression below.
  const A_COL = [["#414186", "#1f968b", "#25ab81", "#472676", "#3f4788", "#bfdf24", "#46317e", "#414286", "#cde01d", "#2ab07e"], ["#23a883", "#2e6c8e", "#2d6e8e", "#453681", "#3d4c89", "#472575", "#8bd546", "#218e8c", "#414186", "#55c666"], ["#345e8d", "#2a778e", "#462f7c", "#9dd93a", "#2eb27c", "#3e4989", "#1f968b", "#45347f", "#27ad80", "#365b8c"], ["#1e998a", "#33618d", "#dfe318", "#443982", "#2c708e", "#1ea087", "#472676", "#3e4888", "#74d054", "#6dce58"], ["#e7e419", "#1e9d88", "#423e85", "#24848d", "#39558b", "#4bc26c", "#1e9e88", "#30688d", "#33608d", "#9dd93a"], ["#1f968b", "#228a8d", "#d7e219", "#3d4b89", "#1f938b", "#3e4989", "#c7e01f", "#1f938b", "#2c728e", "#3d4b89"], ["#277d8e", "#2d6e8e", "#277d8e", "#472c7b", "#1fa187", "#2ab07e", "#5bc862", "#d2e11b", "#2a778e", "#35b778"], ["#2f698d", "#287b8e", "#4bc26c", "#70ce56", "#28ae7f", "#3c4e8a", "#3c4e8a", "#60c960", "#47c06e", "#addc30"]];
  const A = [[0.195, 0.525, 0.603, 0.105, 0.212, 0.905, 0.142, 0.198, 0.927, 0.625], [0.59, 0.352, 0.36, 0.158, 0.23, 0.102, 0.823, 0.495, 0.195, 0.73], [0.297, 0.398, 0.135, 0.853, 0.64, 0.22, 0.525, 0.15, 0.613, 0.285], [0.537, 0.31, 0.955, 0.168, 0.37, 0.56, 0.105, 0.215, 0.787, 0.777], [0.968, 0.552, 0.185, 0.455, 0.263, 0.71, 0.555, 0.335, 0.305, 0.853], [0.525, 0.477, 0.943, 0.228, 0.515, 0.22, 0.917, 0.515, 0.378, 0.228], [0.425, 0.36, 0.425, 0.125, 0.565, 0.625, 0.743, 0.935, 0.398, 0.667], [0.34, 0.415, 0.71, 0.782, 0.618, 0.237, 0.237, 0.75, 0.703, 0.877]];
  // weights: units 2, 5, 8 come out near zero — the features regression ignores (beat 7)
  const IGN = [2, 5, 8];
  const W = [...Array(NU)].map((_, j) => IGN.includes(j) ? .04 : .35 + .65*rnd());
  // viridis, 0..1 (matplotlib stops), as in the paper's matrices
  const VIR = [[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[110,206,88],[181,222,43],[253,231,37]];
  const viridis = t => { t = Math.max(0, Math.min(1, t)) * (VIR.length - 1); const i = Math.min(VIR.length - 2, Math.floor(t)), f = t - i;
    return 'rgb(' + VIR[i].map((c, k) => Math.round(c + f*(VIR[i+1][k] - c))).join(',') + ')'; };
  const norm = v => { const lo = Math.min(...v), hi = Math.max(...v); return v.map(x => (x-lo)/(hi-lo)); };
  const PRED = norm(A.map(r => r.reduce((s, a, j) => s + a*W[j], 0)));
  const MEAS = norm(PRED.map(p => p + .6*(rnd() - .5)));   // r ≈ .85 with panel A’s values
  const corr = (x, y) => { const n=x.length, mx=x.reduce((a,b)=>a+b)/n, my=y.reduce((a,b)=>a+b)/n;
    let sxy=0, sx=0, sy=0; for(let i=0;i<n;i++){ sxy+=(x[i]-mx)*(y[i]-my); sx+=(x[i]-mx)**2; sy+=(y[i]-my)**2; }
    return sxy/Math.sqrt(sx*sy); };
  const RDM_M = SOUNDS.map((_, i) => SOUNDS.map((_, k) => i === k ? 0 : 1 - corr(A[i], A[k])));
  const RDM_B = RDM_M.map((r, i) => r.map((d, k) => i === k ? 0 : d));
  for(let i=0;i<NR;i++) for(let k=i+1;k<NR;k++){ const v = Math.max(0, RDM_M[i][k] + 1.1*(rnd()-.5)); RDM_B[i][k] = RDM_B[k][i] = v; }
  const rdmMax = Math.max(...RDM_M.flat(), ...RDM_B.flat());
  // beat 6: a feature the model uses vs a property cortex tracks, across the same sounds
  // evenly spaced, in a fixed order, so the sound labels never collide
  const FX = [.05, .62, .48, .9, .33, 1, .76, .19];
  const FY = norm(FX.map(x => x + .18*(rnd() - .5)));

  // ── geometry (viewBox units) ───────────────────────────────────────────────
  const Y0 = 64, RH = 30;                 // first row top, row height (square cells: RH = CW)
  const MX = 160, CW = 30;                // activation matrix x, column width
  const PX = 510, MXX = 600, VW = 34;     // predicted / measured columns
  const WY = Y0 + NR*RH + 14;             // weights row
  const SC = {x:662, y:96, w:110, h:110}; // regression scatter
  const RX = [806, 1022], RC = 18, RY = 88;  // RDMs: x of each, cell, top
  const CV = {x:850, y:84, w:300, h:220}; // beat-6 covariation scatter

  const el = (tag, attrs, parent=svg, text) => { const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]); if(text != null) e.textContent = text; parent.appendChild(e); return e; };
  // data-on="b": shown from beat b on; data-off="b": hidden from beat b on
  const on = (e, b, delay=0, off) => { e.classList.add('on'); e.dataset.on = b; if(off != null) e.dataset.off = off;
    if(delay) e.style.setProperty('--d', delay + 's'); return e; };

  // ── regression panel ───────────────────────────────────────────────────────
  const gReg = el('g', {class:'panel', id:'reg'});
  el('text', {x:0, y:22, class:'ph'}, gReg, 'Regression');
  el('text', {x:146, y:Y0 - 10, 'text-anchor':'end', class:'hd snd'}, gReg, 'natural sounds');
  SOUNDS.forEach((s, i) => {
    el('text', {x:146, y:Y0 + i*RH + 20, 'text-anchor':'end', class:'lab snd'}, gReg, s);
    // a pine outline around each sound's label, for the last beat
    const hi = el('rect', {x:30, y:Y0 + i*RH + 2, width:122, height:RH - 4, rx:5, class:'rowhi'}, gReg);
    hi.dataset.on = 8; hi.style.setProperty('--d', (i*.06) + 's');
  });
  // the network is panel A's own drawing: fig5a-network.png, its waveforms → network with the
  // red stage, cropped (bounds detected) from fig5a-regression-voxel.png at (13, 994), 565 × 190
  const gNet = on(el('g', {}, gReg), 1);
  el('image', {href:'../assets/final/ch1-current-methods/outline/fig5a-network.png?v=11', x:MX, y:0, width:40*565/190, height:40}, gNet);
  el('text', {x:MX, y:Y0 - 10, class:'hd'}, gNet, 'units →');
  // activations: one <g> per unit column, so a whole column can be marked "ignored"
  const cols = [...Array(NU)].map((_, j) => el('g', {class:'act'}, gReg));
  A.forEach((row, i) => row.forEach((v, j) => {
    const c = el('rect', {x:MX + j*CW, y:Y0 + i*RH, width:CW - 1, height:RH - 1, class:'cell'}, cols[j]);
    c.setAttribute('fill', A_COL[i][j]); c.dataset.on = 1; c.dataset.v = 1;   // no stagger: they sit under the zoomed pixels
  }));
  // weights, aligned under the columns they multiply
  on(el('text', {x:146, y:WY + 18, 'text-anchor':'end', class:'lab'}, gReg, 'weights'), 2);
  const wcols = W.map((w, j) => { const g = el('g', {class:'w'}, gReg);
    const c = el('rect', {x:MX + j*CW, y:WY, width:CW - 2, height:24, rx:2, class:'cell'}, g);
    c.dataset.on = 2; c.dataset.v = (.15 + .8*w).toFixed(2); c.style.setProperty('--d', (j*.04) + 's'); return g; });
  on(el('text', {x:MX, y:WY + 46, class:'ax'}, gReg, 'fit for one voxel'), 2);
  const ign = on(el('text', {x:MX, y:WY + 46, class:'ax', style:'fill:var(--ink); font-weight:700'}, gReg,
    'weights near 0: these features do not affect the prediction'), 6);
  // predicted (outlined) and measured (filled) voxel columns
  on(el('text', {x:PX + VW/2, y:Y0 - 10, 'text-anchor':'middle', class:'hd'}, gReg, 'predicted'), 2);
  on(el('text', {x:MXX + VW/2, y:Y0 - 10, 'text-anchor':'middle', class:'hd'}, gReg, 'measured'), 3);
  const xw = (MX + NU*CW + PX)/2 - 3, yw = Y0 + NR*RH/2;
  const gXw = on(el('g', {}, gReg), 2, .25);
  el('circle', {cx:xw, cy:yw, r:15, fill:'#fff', stroke:'var(--ink)', 'stroke-width':1.5}, gXw);
  el('text', {x:xw, y:yw + 6, 'text-anchor':'middle', style:'font-size:14px; fill:var(--ink)'}, gXw, '× w');
  el('path', {d:`M${PX - 3},${yw} l-8,-5 v10 z`, fill:'var(--ink)'}, gXw);
  const bracket = (x, g) => { const y0 = Y0 - 4, y1 = Y0 + NR*RH + 3;
    el('path', {d:`M${x - 3},${y0} h-6 V${y1} h6 M${x + VW + 3},${y0} h6 V${y1} h-6`, fill:'none', stroke:'var(--ink)', 'stroke-width':1.5}, g); };
  const gP = on(el('g', {}, gReg), 2, .5), gM = on(el('g', {}, gReg), 3);
  bracket(PX, gP); bracket(MXX, gM);
  PRED.forEach((p, i) => {
    on(el('rect', {x:PX, y:Y0 + i*RH, width:VW, height:RH - 1, fill:viridis(p)}, gReg), 2, .6 + i*.1);
    on(el('rect', {x:MXX, y:Y0 + i*RH, width:VW, height:RH - 1, fill:viridis(MEAS[i])}, gReg), 3, i*.06);
  });
  // scatter: predicted vs measured
  const gSc = on(el('g', {}, gReg), 3, .5);
  el('rect', {x:SC.x, y:SC.y, width:SC.w, height:SC.h, fill:'none', stroke:'var(--border)'}, gSc);
  el('line', {x1:SC.x, y1:SC.y + SC.h, x2:SC.x + SC.w, y2:SC.y, stroke:'var(--faint)', 'stroke-dasharray':'4 4'}, gSc);
  PRED.forEach((p, i) => el('circle', {cx:SC.x + 10 + p*(SC.w - 20), cy:SC.y + SC.h - 10 - MEAS[i]*(SC.h - 20), r:5.5, fill:'var(--ink)'}, gSc));
  el('text', {x:SC.x + SC.w/2, y:SC.y + SC.h + 20, 'text-anchor':'middle', class:'ax'}, gSc, 'predicted');
  el('text', {x:SC.x - 8, y:SC.y + SC.h/2, 'text-anchor':'middle', class:'ax', transform:`rotate(-90 ${SC.x - 8} ${SC.y + SC.h/2})`}, gSc, 'measured');
  el('text', {x:SC.x + SC.w/2, y:SC.y - 14, 'text-anchor':'middle', class:'rv', fill:'var(--ink)'}, gSc,
    'r = ' + corr(PRED, MEAS).toFixed(2));

  el('line', {x1:782, y1:0, x2:782, y2:420, stroke:'var(--border)', 'stroke-width':1.5}, svg);

  // ── RSA panel (beat 4) ─────────────────────────────────────────────────────
  const gRsa = el('g', {class:'panel', id:'rsa'});
  on(el('text', {x:806, y:22, class:'ph'}, gRsa, 'RSA'), 4);
  [[RDM_M, 'model stage', 'var(--slate)', 0], [RDM_B, 'cortical region', 'var(--ochre)', .6]].forEach(([D, name, col, d0], m) => {
    const g = on(el('g', {}, gRsa), 4, d0);
    el('text', {x:RX[m] + NR*RC/2, y:RY - 14, 'text-anchor':'middle', class:'hd'}, g, name);
    D.forEach((r, i) => r.forEach((v, k) => el('rect', {x:RX[m] + k*RC, y:RY + i*RC, width:RC, height:RC,
      fill:viridis(v/rdmMax)}, g)));
    el('text', {x:RX[m] + NR*RC/2, y:RY + NR*RC + 20, 'text-anchor':'middle', class:'ax'}, g, 'sound × sound');
  });
  const gCmp = on(el('g', {}, gRsa), 4, 1.2);
  el('text', {x:(RX[0] + NR*RC + RX[1])/2, y:RY + NR*RC/2 + 7, 'text-anchor':'middle', style:'font-size:22px; fill:var(--muted)'}, gCmp, 'vs');
  const triU = D => D.flatMap((r, i) => r.filter((_, k) => k > i));
  const by = RY + NR*RC + 42;
  el('path', {d:`M${RX[0] + NR*RC/2},${by} v14 H${RX[1] + NR*RC/2} v-14`, fill:'none', stroke:'var(--muted)', 'stroke-width':1.5}, gCmp);
  el('text', {x:(RX[0] + RX[1] + NR*RC)/2, y:by + 42, 'text-anchor':'middle', class:'rv', fill:'var(--ink)'}, gCmp,
    'correlation of dissimilarity matrices: ρ = ' + corr(triU(RDM_M), triU(RDM_B)).toFixed(2));

  // ── covariation panel (beat 6, replaces RSA on slide 2) ────────────────────
  const gCov = el('g', {class:'panel', id:'cov'});
  on(el('text', {x:806, y:22, class:'ph'}, gCov, 'Across natural sounds'), 5);
  const gCv = on(el('g', {}, gCov), 5, .2);
  el('line', {x1:CV.x, y1:CV.y + CV.h, x2:CV.x + CV.w, y2:CV.y + CV.h, stroke:'var(--muted)', 'stroke-width':1.5}, gCv);
  el('line', {x1:CV.x, y1:CV.y, x2:CV.x, y2:CV.y + CV.h, stroke:'var(--muted)', 'stroke-width':1.5}, gCv);
  el('line', {x1:CV.x + 8, y1:CV.y + CV.h - 8, x2:CV.x + CV.w - 8, y2:CV.y + 8, stroke:'var(--faint)', 'stroke-width':2, 'stroke-dasharray':'5 5'}, gCv);
  el('text', {x:CV.x + CV.w/2, y:CV.y + CV.h + 24, 'text-anchor':'middle', class:'ax', style:'font-size:15px'}, gCv, 'a model feature');
  el('text', {x:CV.x - 14, y:CV.y + CV.h/2, 'text-anchor':'middle', class:'ax', style:'font-size:15px',
    transform:`rotate(-90 ${CV.x - 14} ${CV.y + CV.h/2})`}, gCv, 'a property the region responds to');
  SOUNDS.forEach((s, i) => {
    const cx = CV.x + 14 + FX[i]*(CV.w - 28), cy = CV.y + CV.h - 14 - FY[i]*(CV.h - 28);
    const g = on(el('g', {}, gCv), 5, .4 + i*.08);
    el('circle', {cx, cy, r:6, fill:'var(--ink)'}, g);
    el('text', {x:cx + (FX[i] > .75 ? -10 : 10), y:cy + 5, 'text-anchor':FX[i] > .75 ? 'end' : 'start', class:'ax'}, g, s);
  });
  on(el('text', {x:CV.x + CV.w/2, y:CV.y + CV.h + 52, 'text-anchor':'middle', class:'rv', fill:'var(--ink)'}, gCov,
    'natural sounds co-vary'), 5, 1.1);

  // ── benchmark panel (beat 8): Feather et al. 2023 Fig. 7b, Brain-Score IT ───
  // assets/outline/feather2023-brainscore-it.png (1293×1188, 600 dpi crop of p. 13;
  // panel letter removed, y-axis label + ticks taken from the V1 panel beside it)
  const gBs = el('g', {class:'panel', id:'bs'});
  const BS_H = 372, BS_W = BS_H*1293/1188;
  on(el('text', {x:806, y:22, class:'ph'}, gBs, 'Brain-Score benchmarks (vision, IT)'), 7);
  on(el('image', {href:'../assets/final/ch1-current-methods/outline/feather2023-brainscore-it.png?v=11', x:1200 - BS_W, y:36, width:BS_W, height:BS_H}, gBs), 7, .2);

  // everything drawn so far is the schematic; it waits under panel A until beat 1
  const gMain = el('g', {id:'main'});
  [...svg.childNodes].filter(n => n !== gMain).forEach(n => gMain.appendChild(n));

  // ── panel A (beats 0–5), then the zoom (beat 6) ────────────────────────────
  // assets/outline/fig5a-regression.png: Fig. 5A cropped at 600 dpi from Fer's exported
  // Figure5.pdf (results v17, 2026-10-05), panel letter removed; 3640×1300.
  // fig5a-regression-voxel.png (Fer, 2026-10-08): the same panel with its region-map thumbnail
  // replaced by the voxel brain that the mms-logic slide uses (voxel-brain.png: Figure1.pdf at
  // 600 dpi, top "fMRI voxel response" brain with its voxel square, bounds detected), and the red
  // line + arrowhead redrawn from that voxel to v. Same size as the original.
  // Beats 0–5 build the panel component by component: white covers (image px, checked with PIL so
  // no edge cuts a glyph) fade away one group per click.
  const PA = {w:3640, h:1300};
  const PA_COVERS = [   // [x0, y0, x1, y1] px, gone from beat k on
    {k:2, r:[[0, 850, 1170, 1300]]},                                    // activations to natural sounds
    {k:3, r:[[1180, 540, 2080, 1130], [1150, 1060, 1180, 1110]]},       // → ridge regression
    {k:4, r:[[2080, 680, 2562, 910], [2220, 160, 3640, 290]]},          // weights w, × w; "Evaluation"
    {k:5, r:[[1170, 1140, 2240, 1250], [2240, 910, 2800, 1300], [2562, 690, 2800, 910]]},  // held-out → predicted
    {k:6, r:[[2800, 690, 3640, 1080]]},                                 // measured, NSE / R²
  ];
  const PA_BEATS = 6;   // beat 0 = title alone (round 6); 1..6 build panel A; schematic beat b = overall b + 6
  const pk = 1200/PA.w, PAH = PA.h*pk, PAY = (430 - PAH)/2;
  const pa = el('g', {id:'panelA'});
  el('image', {href:'../assets/final/ch1-current-methods/outline/fig5a-regression-voxel.png?v=11', x:0, y:PAY, width:1200, height:PAH}, pa);
  const paCovers = PA_COVERS.flatMap(c => c.r.map(([x0, y0, x1, y1]) => {
    const e = el('rect', {x:x0*pk, y:PAY + y0*pk, width:(x1 - x0)*pk, height:(y1 - y0)*pk, fill:'#fff', class:'pacov'}, pa);
    e.dataset.k = c.k; return e; }));
  // Zoom: panel A's matrix cell grid (pixel runs found with PIL: origin (673.9, 946.0) px, pitch
  // 8.53 px; the first row sits partly under the grey frame) is scaled so its cell (i, j) lands
  // exactly on schematic cell (i, j) at (MX + j·CW, Y0 + i·RH). Same pixels, same place.
  const CELL = {x:673.9, y:946.0, p:8.53};
  const zs = CW/(CELL.p*pk), ztx = MX - zs*CELL.x*pk, zty = Y0 - zs*(PAY + CELL.y*pk);
  const ZOOM = `translate(${ztx.toFixed(2)}px, ${zty.toFixed(2)}px) scale(${zs.toFixed(4)})`;

  // ── beats ──────────────────────────────────────────────────────────────────
  // Each beat is data; render() reads BEATS[beat] only, so any jump lands settled.
  //   dimReg / dimRsa : push that panel back   panel : which right-hand panel shows
  //   ignored : grey the ignored feature columns   natural : sound labels go pine
  const BEATS = [
    { panel:'rsa' },
    { panel:'rsa' },
    { panel:'rsa' },
    { panel:'rsa' },
    { panel:'rsa', dimReg:true },
    { panel:'cov', dimReg:true },
    { panel:'cov', dimRsa:true, ignored:true },
    { panel:'bs',  dimReg:true, ignored:true },
    { panel:'bs',  dimRsa:true, ignored:true, natural:true },
  ];
  const N = PA_BEATS + BEATS.length;   // 15 beats: title 0, panel A 1–6, schematic 7–14
  const QS = new URLSearchParams(location.search);
  const LO = Math.max(0, Math.min(N-1, +(QS.get('from') || 0)));
  const HI = Math.max(LO, Math.min(N-1, QS.get('to') != null ? +QS.get('to') : N-1));
  const titleEl = document.getElementById('title');
  const TITLES = ['Comparing models with <em>brain responses</em>', 'Testing models with <em>natural stimuli</em>'];

  // Speaker notes: everything on the slide gets said; the prose lives here.
  const SCRIPT = [
    `To answer this question, we need a way to compare a model with brain responses. How is this usually done?`,
    `There are many ways to compare a model with brain responses. One common approach is regression, shown here as we used it in this chapter. It starts from one voxel: its measured responses to a set of natural sounds form a vector, v.`,
    `The same natural sounds are passed through the network, and the time-averaged activations of one model stage are recorded, giving a matrix with one row per sound and one column per model unit.`,
    `Ridge regression is fit to predict the voxel’s responses, v, from the model activations.`,
    `This yields a set of weights, w: one weight per model unit.`,
    `To evaluate the fit, the model activations to held-out sounds are multiplied by the weights, which gives a predicted response for the voxel.`,
    `The prediction is compared with the voxel’s measured response to the same held-out sounds, using the normalized squared error or the noise-corrected R².`,
    `Zooming in on the model activations: each row is one natural sound, such as speech, a dog barking, piano or rain, and each column is one unit of the model stage.`,
    `The fitted weights combine these units into a prediction of the voxel’s response to each sound.`,
    `By this measure, task-optimized networks predict auditory cortical responses better than earlier models (Kell et al. 2018; Tuckute et al. 2023).`,
    `A second common approach, representational similarity analysis, compares how dissimilar pairs of sounds are for the model and for the region (Kriegeskorte et al. 2008).`,
    `These comparisons leave open whether the networks have learned representations like those of auditory cortex. Natural sounds vary in many properties at once, and networks trained on behaviorally relevant tasks learn features that are correlated with behaviorally relevant properties. A model feature can therefore covary with a property the region responds to, and predict the region’s responses without being what the region computes (Naselaris et al. 2011).`,
    `In addition, the fitted weights can ignore features that do not aid prediction. Here, the weights for these units are near zero, so whatever the model represents with them does not affect the prediction. Models that represent sound differently can therefore receive similar scores (Tuckute et al. 2023; Conwell et al. 2024).`,
    `Benchmarks built on these comparisons show a related limitation. In this vision result from Feather et al. (2023), each point is a network. Standard-trained networks score well on brain benchmarks despite their adversarial vulnerability, and benchmark scores were not significantly related to how recognizable each network’s metamers were to humans.`,
    `In each of these comparisons, the stimuli are natural sounds, so the evaluations are confounded by correlations among the properties of natural stimuli. Model-matched stimuli address this by isolating model representations (Norman-Haignere &amp; McDermott 2018). They ask whether what a model discards at a given stage is also irrelevant to a region’s responses.`,
  ];

  const notesEl = document.getElementById('notes');
  const dotsEl = document.getElementById('dots');
  for(let b = LO; b <= HI; b++){ const d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d); }
  let beat = LO;

  function render(){
    const sb = Math.max(0, beat - PA_BEATS);   // the schematic's own beat
    const cur = BEATS[sb], onPanel = beat <= PA_BEATS;
    document.body.classList.toggle('panelA', onPanel);
    pa.style.transform = onPanel ? 'none' : ZOOM;
    pa.style.opacity = onPanel && beat > 0 ? 1 : 0;
    document.body.classList.toggle('titleonly', beat === 0);
    paCovers.forEach(c => c.style.opacity = beat >= +c.dataset.k ? 0 : 1);
    document.querySelectorAll('[data-beat]').forEach(e => e.classList.toggle('shown', beat >= +e.dataset.beat));
    svg.querySelectorAll('[data-on]').forEach(e => {
      const shown = sb >= +e.dataset.on && !(e.dataset.off != null && sb >= +e.dataset.off);
      e.classList.toggle('shown', shown);
      if(e.dataset.v) e.style.opacity = shown ? e.dataset.v : 0;   // cells carry their own value
    });
    document.getElementById('reg').classList.toggle('dim', !!cur.dimReg);
    ['rsa', 'cov', 'bs'].forEach(id => { const g = document.getElementById(id);
      g.style.display = cur.panel === id ? '' : 'none'; g.classList.toggle('dim', !!cur.dimRsa); });
    const half2 = sb >= 5;
    document.body.classList.toggle('half2', half2);
    titleEl.innerHTML = TITLES[half2 ? 1 : 0];
    IGN.forEach(j => { cols[j].classList.toggle('ignored', !!cur.ignored); wcols[j].classList.toggle('ignored', !!cur.ignored); });
    // the "fit for one voxel" caption gives way to the ignored-weights caption
    gReg.querySelectorAll('text.ax').forEach(t => { if(t.textContent === 'fit for one voxel') t.style.display = cur.ignored ? 'none' : ''; });
    document.body.classList.toggle('natural', !!cur.natural);
    [...dotsEl.children].forEach((d, k) => d.classList.toggle('on2', k <= beat - LO));
    notesEl.innerHTML = SCRIPT[beat];
  }

  function advance(){ if(beat < HI){ beat++; render(); } }
  function goBack(){ if(beat > LO){ beat--; render(); } }
  function jump(b){
    beat = Math.max(LO, Math.min(HI, b));
    document.body.classList.add('settling');
    render();
    void document.body.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('settling')));
  }

  document.body.addEventListener('click', e => { if(!e.target.closest('#notes')) advance(); });
  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); advance(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); goBack(); }
    else if(e.key === 'n' || e.key === 'N'){ notesEl.classList.toggle('on'); }
    else if(e.key === 'r' || e.key === 'R'){ jump(LO); }
  });

  window[SLIDE_NAME] = {
    advance, back: goBack,
    atStart: () => beat === LO, atEnd: () => beat === HI,
    reset: () => jump(LO), resetToEnd: () => jump(HI),
    getBeat: () => beat, count: () => N, setBeat: jump,
  };
  jump(LO);
})();
</script>
