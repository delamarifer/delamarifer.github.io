<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normalized squared error</title>
<link rel="stylesheet" href="../vendor/fraunces.css">
<!-- the anchor brain's box, shared by every Ch. 1 experiment scene (owned by ch1-experiment) -->
<link rel="stylesheet" href="shared/anchor.css">
<style>
  :root{
    --ink:#0f172a; --body:#334155; --muted:#64748b; --faint:#94a3b8; --border:#e2e8f0;
    --nat:#38506e;   /* natural-sound responses (x): slate */
    --mm:#7a5ea0;    /* model-matched responses (y): plum */
    --err:#b4533a;   /* squared differences, the NSE: brick */
    --cor:#3f7357;   /* correlation r: pine */
    --pin:#b45309;   /* the voxel pin, as in ch1-scanning */
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:#fff; color:var(--body); font-family:var(--sans); overflow:hidden;
        cursor:pointer; user-select:none; -webkit-user-select:none; }

  #title{ position:absolute; top:3.4vh; left:3.2vw; font-family:var(--serif); color:var(--muted);
    font-size:clamp(13px,1.15vw,16px); font-weight:700; letter-spacing:.09em; text-transform:uppercase; }

  /* ── the anchor brain: Fig. 4A locator + enlargement, in whole-regions.png pixels ── */
  #brain{ width:100%; height:100%; display:block; }
  .numeral text{ font-family:var(--sans); font-weight:700; fill:#fff; stroke:#000; stroke-width:9;
                 paint-order:stroke; text-anchor:middle; dominant-baseline:central; }
  #pinHalo{ opacity:0; transform-box:fill-box; transform-origin:center; }
  #pinHalo.go{ animation:halo 1.6s ease-out 2; }
  @keyframes halo{ 0%{ opacity:1; transform:scale(.5) } 100%{ opacity:0; transform:scale(2.2) } }

  /* ── the NSE figure, in .anchor-content ── */
  #fig{ width:100%; height:100%; display:block; overflow:visible; }
  #fig text{ font-family:var(--sans); }
  .lbl{ font-size:21px; fill:var(--muted); }
  .lbl.b{ font-weight:700; fill:var(--body); }
  .eq{ font-family:var(--serif) !important; fill:var(--ink); }
  .axis{ stroke:var(--faint); stroke-width:1.6; }
  .diag{ stroke:var(--faint); stroke-width:1.6; stroke-dasharray:7 6; }

  #cap{ position:absolute; left:3.2vw; bottom:6vh; max-width:60vw;
    font-size:clamp(15px,1.7vw,25px); font-weight:500; color:var(--ink); letter-spacing:-.01em;
    line-height:1.28; transition:opacity .32s ease, transform .32s ease; }
  #cap.swap{ opacity:0; transform:translateY(7px); }
  #cap .err{ color:var(--err); } #cap .cor{ color:var(--cor); }

  #dots{ position:absolute; right:2rem; bottom:1.1rem; display:flex; gap:.45rem; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid #cbd5e1;
        transition:background .2s, border-color .2s; cursor:pointer; }
  .dot.on{ background:var(--ink); border-color:var(--ink); }
  #notes{ position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.965);
    border-top:1px solid var(--border); padding:16px 4% 18px; display:none;
    font-size:clamp(13px,1.15vw,16px); line-height:1.6; pointer-events:none; max-height:42%; overflow:auto; }
  #notes.on{ display:block; }
  #notes b{ color:var(--ink); font-family:var(--serif); }
</style>
</head>
<body>
  <h1 id="title">Measuring dissimilarity</h1>

  <div class="anchor-brain">
    <!-- same composition as ch1-scanning (scenes/scanning-run.html): the whole hemisphere,
         the locator box, and the enlargement re-using #bw -->
    <svg id="brain" viewBox="0 0 1947 2976" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="zc"><rect x="282" y="876" width="1000" height="686"/></clipPath>
        <radialGradient id="pinGlow"><stop offset="0" stop-color="#b45309" stop-opacity=".6"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="bw">
        <image href="../assets/final/ch1-nse/outline/anchor/whole-regions.png?v=2" width="1947" height="1580"/>
        <g id="pin" transform="translate(780 1080)">
          <circle id="pinHalo" r="60" fill="url(#pinGlow)"/>
          <circle r="17" fill="#b45309" stroke="#fff" stroke-width="7"/>
        </g>
      </g>
      <rect x="282" y="876" width="1000" height="686" fill="none" stroke="#000" stroke-width="6"/>
      <g transform="translate(0 1640) scale(1.947) translate(-282 -876)" clip-path="url(#zc)"><use href="#bw"/></g>
      <g class="numeral" font-size="96">
        <text x="771" y="2029">1</text><text x="1373" y="2364">2</text><text x="629" y="2401">3</text>
      </g>
    </svg>
  </div>

  <div class="anchor-content">
    <svg id="fig" viewBox="0 0 1100 800" preserveAspectRatio="xMidYMid meet">
      <g id="dyn"></g>
      <g id="card" opacity="0"></g>
    </svg>
  </div>

  <p id="cap"></p>
  <div id="dots"></div>
  <div id="notes"></div>

<script>
// ═══ WHAT THIS SCENE SHOWS ═══════════════════════════════════════════════════
// Part ch1-nse: how the normalized squared error compares one voxel's responses to
// natural sounds (x) and to their model-matched versions (y). Fer chose (2026-10-07):
// compact, bars first, keep the real-values card, plot on top / equation below.
//
// ACT 1 — THE DATA   (0-1): one voxel; its natural responses, then its matched responses.
// ACT 2 — THE NSE    (2-4): square each gap and average → compare with unrelated pairs
//                           → the scale: unrelated ≈ 1, identical 0, this voxel between.
// ACT 3 — WHY NOT r  (5-6): the same data as a scatter; a shift keeps r = 1 but raises NSE.
// ACT 4 — REAL       (7):   the two example voxels' real r and NSE.
//
// ALL RESPONSE VALUES ARE SCHEMATIC (labelled on screen) except the card on beat 7,
// which holds the paper's example-voxel numbers (Region 1: r 0.43, NSE 0.34;
// Region 3: r 0.54, NSE 0.70). Every number shown on beats 2-6 is computed live from
// what is drawn: NSE = ⟨(x−y)²⟩ / (⟨x²⟩ + ⟨y²⟩ − 2⟨x⟩⟨y⟩).
//
// The brain is the anchor (outline/contracts/anchor-brain.md); the pin is ch1-scanning's
// voxel (whole-image 780, 1080, in Region 1), so "one voxel" is the one already measured.
//
// Deck hook: window.nseExplainer = {advance, back, atStart, atEnd, reset, resetToEnd}
const SLIDE_NAME = 'nseExplainer';

// ── schematic data: 8 sounds ────────────────────────────────────────────────
const X  = [2.1, 3.0, 1.2, 2.6, 0.8, 1.8, 2.9, 1.5];   // natural
const YM = [1.7, 2.6, 1.6, 2.0, 1.1, 1.3, 2.2, 1.9];   // matched (this voxel: NSE 0.28, r 0.85)
// a derangement whose squared error equals the denominator exactly (NSE 1.00): the
// "unrelated" pairing. Matched bar j slides to slot SHUF_SLOT[j].
const SHUF = [4,3,6,2,5,0,7,1];                        // slot i gets matched bar SHUF[i]
const SHUF_SLOT = SHUF.map((_, j) => SHUF.indexOf(j));
const SHIFT = 0.8;                                     // beat 6: y = x − 0.8

// ── geometry (viewBox 1100 × 800) ───────────────────────────────────────────
const PX0 = 90, PX1 = 1080, BASE = 360, VMAX = 3.5, K = (BASE - 40) / VMAX;
const SLOT = (PX1 - PX0) / 8, BW = 34;
const SQ = 0.8 * K;                        // px per response unit for every square (tray + equation)
const TRAY = 404;                          // top of the per-sound squares, under the baseline
const SX0 = 330, SY0 = 440, SK = 400 / VMAX;   // scatter: x-axis from SX0, baseline SY0
const EQY = 660, EQX = 220;                // fraction line, centre of the squares
const MX0 = 730, MW = 270;                 // meters
const MMAX = 1.2;                          // meter range 0 … 1.2 (tick at 1)

// ── state: every field tweens; arrays elementwise ───────────────────────────
const S0 = {
  nat:0, mm:0, mpos:[0,1,2,3,4,5,6,7], mval:YM.slice(),
  gap:0, sq:0, num:0, live:1, den:0, denLive:0, formula:0,
  meter:0, ticks:0, morph:0, err:0, rmeter:0, plot:1, card:0,
};
const K_ = s => ({...S0, ...s});
// beats: a list of keyframes, each {dur, ...state}. Jumping lands on the last one.
const B0 = {nat:1};
const B1 = {...B0, mm:1};
const B2 = {...B1, gap:1, sq:1, num:1};
const B4 = {...B2, den:1, formula:1, meter:1, ticks:1};
const B5 = {...B4, morph:1, err:1, gap:0, sq:0};
const BEATS = [
  { cap:'One voxel: its response to each natural sound', keys:[[0, B0]] },
  { cap:'…and to each sound’s <i>model-matched</i> version', keys:[[700, B1]] },
  { cap:'Square each difference, then average', keys:[[600, {...B1, gap:1}], [800, B2]] },
  { cap:'Compare with pairs that don’t belong together', keys:[
      [1300, {...B2, live:0, mpos:SHUF_SLOT}],
      [900,  {...B2, live:0, mpos:SHUF_SLOT, den:1, denLive:1}]] },
  { cap:'NSE: <span class="err">0 identical</span> · <span class="err">≈1 unrelated</span>', keys:[
      [500,  {...B4, mpos:SHUF_SLOT, ticks:0}],
      [1100, {...B4, ticks:0, mval:X.slice()}],
      [900,  B4]] },
  { cap:'The same voxel as a scatter: distance from the diagonal', keys:[[1300, B5]] },
  { cap:'Shift every response: <span class="cor">r stays 1</span>, <span class="err">NSE rises</span>', keys:[
      [400,  {...B5, rmeter:1}],
      [1000, {...B5, rmeter:1, mval:X.slice()}],
      [1100, {...B5, rmeter:1, mval:X.map(v => v - SHIFT)}]] },
  { cap:'Real example voxels: higher <span class="cor">r</span>, yet <span class="err">less similar</span>', keys:[
      [700, {...B5, rmeter:1, mval:X.map(v => v - SHIFT), plot:.12, card:1}]] },
].map(b => ({...b, keys: b.keys.map(([d, s]) => [d, K_(s)])}));
const N = BEATS.length;

const SCRIPT = [
  `<b>One voxel.</b> This is the voxel we measured, in Region 1. Each dark bar is its response to one
   natural sound. These values are schematic, to show how the measure works.`,
  `<b>Matched sounds.</b> Next to each, its response to that sound’s model-matched version. If the
   model captured everything this voxel responds to, each pair would be the same height.`,
  `<b>Squared error.</b> Take the difference in each pair, square it, and average over sounds. That
   average is the top of the fraction.`,
  `<b>Compared with unrelated.</b> To put that on a scale, compare it with pairs that don’t belong
   together: shuffle which matched sound goes with which natural sound, and the squares grow. The
   average for unrelated pairs is the bottom of the fraction (the formula computes it directly:
   ⟨x²⟩ + ⟨y²⟩ − 2⟨x⟩⟨y⟩). Norman-Haignere and McDermott, 2018.`,
  `<b>The scale.</b> Unrelated pairs give an NSE of about 1. Identical responses give 0. This voxel
   sits in between, near 0.3.`,
  `<b>As a scatter.</b> The same pairs as points: across, the natural sound; up, its matched version.
   The diagonal is where the two responses are identical, and each point’s error is its distance
   from it. This is how the next slide shows real voxels.`,
  `<b>Why not a correlation?</b> Start from identical responses, then lower every matched response by
   the same amount. The points stay on a line, so the correlation stays at 1. But the responses are
   no longer the same, and the NSE rises. The NSE is sensitive to differences in mean and scale; a
   correlation is not.`,
  `<b>Real voxels.</b> The two example voxels on the next slide. The Region 3 voxel has the higher
   correlation, 0.54 against 0.43, but its responses to natural and matched sounds are less
   similar: NSE 0.70 against 0.34.`,
];

// ── helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = t => Math.max(0, Math.min(1, t));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const xAt = p => { const i = Math.max(0, Math.min(6, Math.floor(p))), f = p - i;   // X at a fractional slot
  return p >= 7 ? X[7] : lerp(X[i], X[i+1], f); };
function corr(x, y){ const a = mean(x), b = mean(y); let s = 0, u = 0, w = 0;
  x.forEach((v, i) => { s += (v-a)*(y[i]-b); u += (v-a)**2; w += (y[i]-b)**2; });
  return u*w < 1e-9 ? 1 : s / Math.sqrt(u*w); }
const fmt = v => v.toFixed(2);

// ── draw one state ──────────────────────────────────────────────────────────
function draw(s){
  const g = [], m = s.morph, bm = 1 - m;
  // per matched bar j: the x it is paired with (at its current slot) and the squared gap
  const xs = s.mpos.map(xAt), d = s.mval.map((v, j) => xs[j] - v);
  const numLive = mean(d.map(v => v*v));
  const denF = mean(X.map(v => v*v)) + mean(s.mval.map(v => v*v)) - 2*mean(X)*mean(s.mval);
  const numRealSide = Math.sqrt(mean(X.map((v, i) => (v - YM[i])**2)));
  // top of the fraction: this voxel's own error, held (live = 0) while the shuffle builds the bottom
  const numSide = Math.sqrt(lerp(numRealSide**2, numLive, s.live));
  // bottom: the shuffle's error while it builds, then the formula
  const denSide = s.meter > 0 ? Math.sqrt(denF) : Math.sqrt(lerp(numRealSide**2, numLive, s.denLive));
  const nse = numSide**2 / denF;

  g.push(`<g opacity="${s.plot}">`);
  // legend + "schematic"
  if(s.nat > 0){
    g.push(`<g opacity="${s.nat}"><rect x="${PX0}" y="0" width="18" height="18" fill="var(--nat)"/>
      <text class="lbl b" x="${PX0+26}" y="16">natural sound <tspan class="eq" font-style="italic">x</tspan></text></g>`);
    g.push(`<text class="lbl" x="${PX1}" y="16" text-anchor="end" opacity="${s.nat}" font-style="italic">schematic</text>`);
  }
  if(s.mm > 0) g.push(`<g opacity="${s.mm}"><rect x="${PX0+270}" y="0" width="18" height="18" fill="var(--mm)"/>
      <text class="lbl b" x="${PX0+296}" y="16">model-matched <tspan class="eq" font-style="italic">y</tspan></text></g>`);

  // ── bars (fade as the scatter forms) ──
  if(bm > 0 && s.nat > 0){
    g.push(`<g opacity="${bm}">`);
    g.push(`<line class="axis" x1="${PX0}" y1="${BASE}" x2="${PX1}" y2="${BASE}"/>`);
    X.forEach((v, i) => {
      const x = PX0 + i*SLOT + 18, h = v*K*s.nat;
      g.push(`<rect x="${x}" y="${BASE-h}" width="${BW}" height="${h}" fill="var(--nat)"/>`);
      g.push(`<text class="lbl" x="${PX0 + i*SLOT + 18 + BW}" y="${BASE+24}" text-anchor="middle" font-size="16">♪${i+1}</text>`);
    });
    if(s.mm > 0) s.mval.forEach((v, j) => {
      const x = PX0 + s.mpos[j]*SLOT + 18 + BW + 4, h = v*K*s.mm;
      g.push(`<rect x="${x}" y="${BASE-h}" width="${BW}" height="${h}" fill="var(--mm)"/>`);
    });
    // gaps: from the matched bar's top to its natural partner's height, then the square below
    s.mval.forEach((v, j) => {
      const x = PX0 + s.mpos[j]*SLOT + 18 + 2*BW + 10, y1 = BASE - xs[j]*K, y2 = BASE - v*K;
      if(s.gap > 0 && Math.abs(d[j]) > .02){
        g.push(`<g opacity="${s.gap}"><line x1="${x-2*BW-6}" y1="${y1}" x2="${x}" y2="${y1}" stroke="var(--err)" stroke-width="1.5" stroke-dasharray="4 4"/>
          <line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--err)" stroke-width="4"/></g>`);
      }
      if(s.sq > 0){
        const a = Math.abs(d[j])*SQ*s.sq, cx = PX0 + s.mpos[j]*SLOT + 18 + BW + 2;
        g.push(`<rect x="${cx - a/2}" y="${TRAY}" width="${a}" height="${a}" fill="var(--err)" fill-opacity=".3" stroke="var(--err)" stroke-width="2"/>`);
      }
    });
    if(s.sq > 0) g.push(`<text class="lbl" x="${PX0-12}" y="${TRAY+16}" text-anchor="end" opacity="${s.sq}" font-size="17">(x−y)²</text>`);
    g.push(`</g>`);
  }

  // ── scatter ──
  if(m > 0){
    const W = VMAX*SK;
    g.push(`<g opacity="${m}">
      <line class="axis" x1="${SX0}" y1="${SY0}" x2="${SX0+W}" y2="${SY0}"/>
      <line class="axis" x1="${SX0}" y1="${SY0}" x2="${SX0}" y2="${SY0-W}"/>
      <line class="diag" x1="${SX0}" y1="${SY0}" x2="${SX0+W}" y2="${SY0-W}"/>
      <text class="lbl" x="${SX0+W/2}" y="${SY0+30}" text-anchor="middle">response to natural sound <tspan class="eq" font-style="italic">x</tspan></text>
      <text class="lbl" x="${SX0-18}" y="${SY0-W/2}" text-anchor="middle" transform="rotate(-90 ${SX0-18} ${SY0-W/2})">to matched sound <tspan class="eq" font-style="italic">y</tspan></text>
      <text class="lbl" x="${SX0+W+6}" y="${SY0-W+4}" font-size="17">identical</text></g>`);
    s.mval.forEach((v, j) => {
      const bx = PX0 + s.mpos[j]*SLOT + 18 + 1.5*BW + 4, by = BASE - v*K;     // from the matched bar's top
      const px = SX0 + xs[j]*SK, py = SY0 - v*SK;
      const x = lerp(bx, px, ease(m)), y = lerp(by, py, ease(m));
      if(s.err > 0 && m > .9) g.push(`<line x1="${px}" y1="${py}" x2="${px}" y2="${SY0 - xs[j]*SK}" stroke="var(--err)" stroke-width="3.5" opacity="${s.err}"/>`);
      g.push(`<circle cx="${x}" cy="${y}" r="10" fill="var(--mm)" stroke="#fff" stroke-width="2.5"/>`);
    });
  }

  // ── the equation: NSE = (avg square) / (avg square if unrelated) ──
  if(s.num > 0){
    const a = numSide*SQ;
    g.push(`<g opacity="${s.num}">
      <rect x="${EQX-a/2}" y="${EQY-8-a}" width="${a}" height="${a}" fill="var(--err)" fill-opacity=".3" stroke="var(--err)" stroke-width="2.5"/>
      <text class="lbl b" x="${EQX+70}" y="${EQY-34}">average squared difference</text>
      <text class="eq" x="${EQX+70}" y="${EQY-10}" font-size="22">⟨(x − y)²⟩</text></g>`);
  }
  if(s.den > 0){
    const a = denSide*SQ;
    g.push(`<g opacity="${s.den}">
      <text class="eq" x="${EQX-120}" y="${EQY+9}" font-size="30" text-anchor="end">NSE =</text>
      <line x1="${EQX-90}" y1="${EQY}" x2="${EQX+330}" y2="${EQY}" stroke="var(--ink)" stroke-width="2"/>
      <rect x="${EQX-a/2}" y="${EQY+8}" width="${a}" height="${a}" fill="none" stroke="var(--err)" stroke-width="2.5" stroke-dasharray="7 5"/>
      <text class="lbl b" x="${EQX+70}" y="${EQY+34}">same, if the pairs were unrelated</text>
      <text class="eq" x="${EQX+70}" y="${EQY+60}" font-size="20" opacity="${s.formula}">⟨x²⟩ + ⟨y²⟩ − 2⟨x⟩⟨y⟩</text></g>`);
    // citation: deck-wide style (outline/feedback/_deck-wide.md): ≈1rem at 16:9 full screen, ink, not gray
    g.push(`<text x="${EQX-170}" y="${EQY+124}" font-size="16.5" fill="var(--ink)" opacity="${s.formula}">Norman-Haignere &amp; McDermott (2018)</text>`);
  }

  // ── meters ──
  const meterRow = (y, label, v, col, op, ticks) => {
    const p = clamp01(v / MMAX) * MW, one = MW / MMAX;
    let t = `<g opacity="${op}"><text class="lbl b" x="${MX0}" y="${y-14}">${label}</text>
      <rect x="${MX0}" y="${y}" width="${MW}" height="16" rx="8" fill="#f1f5f9"/>
      <rect x="${MX0}" y="${y}" width="${p}" height="16" rx="8" fill="${col}"/>
      <line x1="${MX0+one}" y1="${y-4}" x2="${MX0+one}" y2="${y+20}" stroke="var(--faint)" stroke-width="2"/>
      <text class="lbl" x="${MX0}" y="${y+40}" font-size="16">0</text>
      <text class="lbl" x="${MX0+one}" y="${y+40}" font-size="16" text-anchor="middle">1</text>
      <text x="${MX0+MW+14}" y="${y+16}" font-size="30" font-weight="700" fill="${col}">${fmt(v)}</text>`;
    if(ticks > 0) t += `<g opacity="${ticks}"><text class="lbl" x="${MX0}" y="${y+60}" font-size="15">identical</text>
      <text class="lbl" x="${MX0+one}" y="${y+60}" font-size="15" text-anchor="middle">unrelated</text></g>`;
    return t + `</g>`;
  };
  if(s.meter > 0) g.push(meterRow(EQY-10, 'NSE', nse, 'var(--err)', s.meter, s.ticks));
  if(s.rmeter > 0) g.push(meterRow(EQY-130, 'correlation r', corr(xs, s.mval), 'var(--cor)', s.rmeter, 0));

  g.push(`</g>`);
  $('dyn').innerHTML = g.join('');
  $('dyn').setAttribute('opacity', 1);
  $('card').setAttribute('opacity', s.card);
}

// ── beat 7: the real values ─────────────────────────────────────────────────
$('card').innerHTML = `
  <rect x="120" y="120" width="900" height="460" rx="18" fill="#fff" stroke="var(--border)" stroke-width="2"/>
  <text class="lbl" x="570" y="180" text-anchor="middle">the two example voxels (real data, next slide)</text>
  ${[['Region 1 voxel', '0.43', '0.34', 345], ['Region 3 voxel', '0.54', '0.70', 795]].map(([n, r, e, x]) => `
    <text x="${x}" y="265" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)">${n}</text>
    <text x="${x}" y="350" text-anchor="middle" font-size="40" fill="var(--cor)">r = ${r}</text>
    <text x="${x}" y="430" text-anchor="middle" font-size="40" font-weight="700" fill="var(--err)">NSE = ${e}</text>`).join('')}
  <line x1="570" y1="230" x2="570" y2="460" stroke="var(--border)" stroke-width="2"/>
  <text x="570" y="530" text-anchor="middle" font-size="26" fill="var(--body)">higher correlation, yet less similar responses</text>`;

// ── timeline ────────────────────────────────────────────────────────────────
function mix(a, b, t){
  const o = {};
  for(const k in a) o[k] = Array.isArray(a[k]) ? a[k].map((v, i) => lerp(v, b[k][i], t)) : lerp(a[k], b[k], t);
  return o;
}
const endState = p => BEATS[p].keys[BEATS[p].keys.length - 1][1];
let phase = 0, cur = endState(0), raf = null, capTimer = null;

function play(keys){
  cancelAnimationFrame(raf);
  let from = cur, k = 0, t0 = performance.now();
  const step = now => {
    const [dur, to] = keys[k], t = clamp01((now - t0) / dur);
    cur = mix(from, to, ease(t)); draw(cur);
    if(t >= 1){ if(++k >= keys.length) return; from = to; t0 = now; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function sync(animate){
  const b = BEATS[phase];
  capEl.classList.add('swap'); clearTimeout(capTimer);
  capTimer = setTimeout(() => { capEl.innerHTML = b.cap; capEl.classList.remove('swap'); }, 150);
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i <= phase));
  notesEl.innerHTML = SCRIPT[phase];
  if(animate) play(b.keys);
  else { cancelAnimationFrame(raf); cur = endState(phase); draw(cur); }
  if(phase === 0) pulse();
}
function pulse(){ const h = $('pinHalo'); h.classList.remove('go'); void h.getBBox(); h.classList.add('go'); }

const capEl = $('cap'), dotsEl = $('dots'), notesEl = $('notes');
for(let i = 0; i < N; i++){ const d = document.createElement('div'); d.className = 'dot';
  d.addEventListener('click', e => { e.stopPropagation(); jump(i); }); dotsEl.appendChild(d); }

function advance(){ if(phase >= N-1) return; phase++; sync(true); }
function goBack(){ if(phase <= 0) return; phase--; sync(false); }
function jump(p){ phase = Math.max(0, Math.min(N-1, p)); sync(false); }

addEventListener('click', e => { if(!e.target.closest('#dots')) advance(); });
addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); advance(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); goBack(); }
  else if(e.key === 'n' || e.key === 'N'){ notesEl.classList.toggle('on'); }
  else if(e.key === 'r' || e.key === 'R'){ jump(0); }
  else if(e.key >= '1' && e.key <= String(N)){ jump(+e.key - 1); }
});

window[SLIDE_NAME] = {
  advance, back: goBack,
  atStart: () => phase <= 0, atEnd: () => phase >= N-1,
  reset: () => jump(0), resetToEnd: () => jump(N-1),
};
sync(false);
</script>
