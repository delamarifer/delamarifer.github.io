<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scored by regression</title>
<link rel="stylesheet" href="../vendor/fraunces.css">
<style>
  /* Owned by part ch1-regression (chat 16). A new scene in the layout of
     stage-survival.html (stages × regions, one value per cell on a shared axis),
     scored by regression instead. Mirrors the deck's slide chrome (h1.t, deck-wide
     title size of 2026-10-07). */
  :root{
    --ink:#0f172a; --body:#334155; --muted:#64748b; --border:#e2e8f0; --faint:#cbd5e1;
    --slate:#38506e; --plum:#7a5ea0; --pine:#3f7357;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#fff; color:var(--body); font-family:var(--sans);
             font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
             cursor:pointer; user-select:none; -webkit-user-select:none; }
  .stage{ position:absolute; inset:0; padding:7vh 5vw 9vh; display:flex; flex-direction:column; }
  h1.t{ font-family:var(--serif); font-weight:900; color:var(--ink);
        font-size:clamp(1.8rem, 3.5vw, 3rem); line-height:1.05; letter-spacing:-.015em; margin-bottom:.6rem; }
  h1.t em{ font-style:normal; color:var(--slate); }
  h1.t em.plum{ color:var(--plum); }
  #fig{ flex:1 1 auto; min-height:0; width:100%; display:block; }
  #cap{ font-size:clamp(1rem,1.75vw,1.55rem); color:var(--ink); text-align:center; min-height:1.5em;
        transition:opacity .3s ease, transform .3s ease; }
  #cap.swap{ opacity:0; transform:translateY(6px); }
  #cap .hl{ font-weight:700; }

  svg text{ font-family:var(--sans); }
  .regionhd{ font-size:17px; font-weight:700; fill:var(--ink); }
  .stagelab{ font-size:15px; font-weight:600; fill:var(--ink); }
  .modellab{ font-size:12.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
  .tick{ font-size:12.5px; fill:var(--muted); }
  .val{ font-size:12px; font-weight:700; text-anchor:middle; }

  /* the marks: natural marker (nat), model-matched marker (mm) that slides out of it */
  .on{ opacity:0; transition:opacity .45s ease; transition-delay:var(--d,0s); }
  .on.shown{ opacity:1; }
  .nat path{ transition:fill .45s ease, opacity .45s ease; }
  body.mm .nat path{ fill:#fff; opacity:.75; }
  .mm{ transition:transform .9s cubic-bezier(.3,.7,.2,1), opacity .3s ease; transition-delay:var(--d,0s); }
  .stem{ transition:opacity .5s ease; transition-delay:calc(var(--d,0s) + .5s); }
  .vnat, .vmm{ transition:opacity .35s ease; }
  body.settling *{ transition:none !important; }

  footer{ position:absolute; right:2rem; bottom:1.1rem; }
  #dots{ display:flex; gap:.45rem; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid #cbd5e1; }
  .dot.on2{ background:var(--ink); border-color:var(--ink); }
  #notes{ position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.965);
          border-top:1px solid var(--border); padding:16px 4% 18px; display:none;
          font-size:clamp(13px,1.15vw,16px); line-height:1.6; pointer-events:none; }
  #notes.on{ display:block; }
  #notes b{ color:var(--ink); }
</style>
</head>
<body>
  <div class="stage">
    <h1 class="t">Scored by regression: <em>natural</em> vs. <em class="plum">model-matched</em></h1>
    <svg id="fig" viewBox="0 0 1220 450" preserveAspectRatio="xMidYMid meet"></svg>
    <p id="cap"></p>
  </div>
  <footer><div id="dots"></div></footer>
  <div id="notes"></div>
<script>
// ═══ SCORED BY REGRESSION: NATURAL ALONE VS NATURAL + MODEL-MATCHED ═══
// Pattern B (SVG step reveal). The layout of the stage-survival scorecard (stages ×
// regions, one value per cell on a shared axis), but every value is a regression
// prediction error. Fer (2026-10-07): all values on the same scale, no pass/fail yet.
//
// ACT 0 — THE AXIS    (0): prediction NSE, 0 = perfect, lower is better.
// ACT 1 — NATURAL     (1): held-out natural sounds — every stage, every region, ≈ .13–.27.
// ACT 2 — MATCHED     (2): each model's own model-matched sounds — the marks slide out
//                          from their natural position; the natural mark stays, hollow.
//
// DATA (real, not toy): prediction NSE (two-sided), mean over n = 10 participants, as
// plotted in the paper's regression figure (deck image15 = B, image16 = C). Source:
// ~/Developer/figures/final/fig6/fig6_panelB.csv (row nse, kind natural) and
// fig6_panelC.csv (row nse, kind own_model_matched); run
// results/regression_squared/raw3s_mushra, 2026-09-28, post-baseline-fix, 33 sounds,
// 4 folds. NOTE: not re-run on the 30-session data (v17 README: regression "blocked").
// COLOUR/MARKERS: the figure's own (mmsfig.py PAL; markers as drawn in image15/16).
(function(){
  'use strict';
  const SLIDE_NAME = 'regressionScorecard';
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('fig');

  const REGIONS = [
    {label:'Region 1', c:'#b7cfe8'}, {label:'Region 2', c:'#5d8fc7'}, {label:'Region 3', c:'#1f3f7a'},
  ];
  // nat = held-out natural sounds (B); mm = the model's own model-matched sounds (C)
  const STAGES = [
    {model:'Spectrotemporal', stage:'model',   group:0, c:'#E6801E', m:'circle',  nat:[0.183, 0.210, 0.266], mm:[0.123, 0.316, 0.662]},
    {model:'Standard-trained', stage:'layer 2', group:1, c:'#80CDC1', m:'square',  nat:[0.151, 0.160, 0.193], mm:[0.395, 0.381, 0.495]},
    {model:'Standard-trained', stage:'layer 3', group:1, c:'#35978F', m:'square',  nat:[0.173, 0.164, 0.144], mm:[0.130, 0.201, 0.312]},
    {model:'Standard-trained', stage:'layer 4', group:1, c:'#01665E', m:'square',  nat:[0.191, 0.183, 0.154], mm:[0.755, 0.767, 0.936]},
    {model:'Robust',           stage:'layer 2', group:2, c:'#C9B3E6', m:'diamond', nat:[0.140, 0.154, 0.177], mm:[0.052, 0.109, 0.194]},
    {model:'Robust',           stage:'layer 3', group:2, c:'#9B6FD1', m:'diamond', nat:[0.179, 0.175, 0.141], mm:[0.137, 0.091, 0.140]},
    {model:'Robust',           stage:'layer 4', group:2, c:'#5E2CA5', m:'diamond', nat:[0.168, 0.165, 0.130], mm:[0.123, 0.085, 0.124]},
  ];
  const GROUP_C = ['#E6801E', '#01665E', '#5E2CA5'];

  // ── geometry (viewBox units) ───────────────────────────────────────────────
  const LEFT = 236, TOP = 96, ROW_H = 47, COL_W = 328, COL_GAP = 44;
  const AX_W = COL_W - COL_GAP;
  const colX = i => LEFT + i*COL_W;
  const rowY = i => TOP + i*ROW_H + ROW_H/2 + (STAGES[i].group > 0 ? 8 : 0) + (STAGES[i].group > 1 ? 8 : 0);
  const vx = (i, v) => colX(i) + Math.max(0, Math.min(1, v)) * AX_W;
  const BOT = rowY(STAGES.length - 1) + ROW_H/2;

  const el = (tag, attrs, parent=svg, text) => { const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]); if(text != null) e.textContent = text; parent.appendChild(e); return e; };
  const marker = (kind, c, parent, r=7.5) => {
    const d = kind === 'circle' ? `M${-r},0 a${r},${r} 0 1,0 ${2*r},0 a${r},${r} 0 1,0 ${-2*r},0`
            : kind === 'square' ? `M${-r*.9},${-r*.9} h${1.8*r} v${1.8*r} h${-1.8*r} z`
            : `M0,${-r*1.25} L${r*1.1},0 L0,${r*1.25} L${-r*1.1},0 z`;
    return el('path', {d, fill:c, stroke:c === '#C9B3E6' || c === '#80CDC1' ? '#64748b' : c, 'stroke-width':1.6}, parent);
  };

  // ── axes ───────────────────────────────────────────────────────────────────
  REGIONS.forEach((r, i) => {
    const x0 = colX(i);
    el('rect', {x:x0, y:22, width:15, height:15, fill:r.c, stroke:'#0f172a', 'stroke-width':.8});
    el('text', {x:x0 + 22, y:35, class:'regionhd'}, svg, r.label);
    el('line', {x1:x0, y1:TOP - 18, x2:x0 + AX_W, y2:TOP - 18, stroke:'var(--faint)'});
    [0, .5, 1].forEach(v => {
      const x = vx(i, v);
      el('line', {x1:x, y1:TOP - 22, x2:x, y2:TOP - 14, stroke:'var(--faint)'});
      el('line', {x1:x, y1:TOP - 14, x2:x, y2:BOT, stroke:v === 0 ? '#dbe2ea' : '#eef2f6', 'stroke-width':v === 0 ? 1.4 : 1});
      el('text', {x, y:TOP - 27, class:'tick', 'text-anchor':v === 0 ? 'start' : v === 1 ? 'end' : 'middle'}, svg,
        i === 0 && v === 0 ? '0  perfect' : i === 0 && v === 1 ? '1' : v === .5 ? '0.5' : String(v));
    });
  });
  el('text', {x:14, y:TOP - 27, class:'tick', style:'font-weight:700'}, svg, 'Prediction NSE (lower is better)');

  // ── rows ───────────────────────────────────────────────────────────────────
  const nats = [], mms = [];
  STAGES.forEach((st, ri) => {
    const y = rowY(ri);
    const first = ri === 0 || STAGES[ri-1].group !== st.group;
    if(first) el('text', {x:14, y:y - 9, class:'modellab', fill:GROUP_C[st.group]}, svg, st.model);
    el('text', {x:14, y:first ? y + 11 : y + 5, class:'stagelab'}, svg, st.stage);
    el('line', {x1:0, y1:y + ROW_H/2 - 2, x2:LEFT + 3*COL_W - COL_GAP, y2:y + ROW_H/2 - 2, stroke:'#f1f5f9'});
    REGIONS.forEach((_, ci) => {
      const d = (ri*.07 + ci*.03).toFixed(2) + 's';
      const xn = vx(ci, st.nat[ci]), xm = vx(ci, st.mm[ci]);
      // the stem natural → matched, drawn under the marks
      const stem = el('line', {x1:xn, y1:y, x2:xm, y2:y, stroke:st.c === '#C9B3E6' || st.c === '#80CDC1' ? '#94a3b8' : st.c,
        'stroke-width':2, class:'stem', opacity:0});
      stem.style.setProperty('--d', d);
      // natural mark (+ its value), appears on beat 1
      const gN = el('g', {class:'on nat', transform:`translate(${xn},${y})`});
      gN.style.setProperty('--d', d);
      marker(st.m, st.c, gN);
      const vN = el('text', {x:0, y:-13, class:'val vnat', fill:'var(--body)'}, gN, st.nat[ci].toFixed(2));
      // matched mark: starts on top of the natural one, slides to its own value on beat 2
      const gM = el('g', {transform:`translate(${xn},${y})`});
      const gMi = el('g', {class:'mm'}, gM);
      gMi.style.setProperty('--d', d);
      marker(st.m, st.c, gMi);
      const vM = el('text', {x:0, y:-13, class:'val vmm', fill:'var(--ink)'}, gMi, st.mm[ci].toFixed(2));
      nats.push({g:gN, v:vN}); mms.push({g:gMi, v:vM, dx:xm - xn, stem});
    });
  });

  // ── beats ──────────────────────────────────────────────────────────────────
  const BEATS = [
    { cap:'Each cell: how well regression predicts that region from that stage · <span class="hl">lower is better</span>', nat:false, mm:false },
    { cap:'Natural sounds alone: <span class="hl">every stage predicts well</span>, in every region', nat:true, mm:false },
    { cap:'Add model-matched sounds: <span class="hl">the same stages spread apart</span>', nat:true, mm:true },
  ];
  const N = BEATS.length;

  const SCRIPT = [
    `<b>The scorecard, scored by regression.</b> Same layout as the scorecard from the model-matched results: each row is one model stage, each column a region. But now each cell is a regression score — the prediction error, NSE, for that stage predicting that region. Zero is a perfect prediction; lower is better.`,
    `<b>Natural sounds alone.</b> Held-out natural sounds, the standard test. Every stage of every model predicts every region about equally well: all the errors sit between about 0.13 and 0.27. By this test, the standard-trained and the robust network are indistinguishable.`,
    `<b>Add model-matched sounds.</b> Same fitted regressions, now predicting responses to each model’s own model-matched sounds. The marks slide from where they were on natural sounds to where they land now; the hollow mark is the natural-sound score. The robust network’s stages stay where they were. The standard-trained network’s stages spread out — layer 4 to about 0.8–0.9 in every region — and the spectrotemporal model moves out in Region 3. The two tests disagree: natural sounds alone cannot separate models that model-matched sounds separate.`,
  ];

  const capEl = document.getElementById('cap');
  const notesEl = document.getElementById('notes');
  const dotsEl = document.getElementById('dots');
  for(let b = 0; b < N; b++){ const d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d); }
  let beat = 0, capTimer = null;

  function render(){
    const cur = BEATS[beat];
    nats.forEach(n => { n.g.classList.toggle('shown', cur.nat); n.v.style.opacity = cur.mm ? 0 : 1; });
    mms.forEach(m => {
      m.g.style.opacity = cur.nat ? 1 : 0;
      m.g.style.transform = cur.mm ? `translate(${m.dx}px, 0)` : 'translate(0px, 0)';
      m.v.style.opacity = cur.mm ? 1 : 0;
      m.stem.setAttribute('opacity', cur.mm ? .5 : 0);
    });
    // before beat 2 the matched mark sits exactly on the natural one, so hide it there
    document.body.classList.toggle('mm', !!cur.mm);
    mms.forEach(m => { if(!cur.mm) m.g.style.opacity = 0; });
    [...dotsEl.children].forEach((d, k) => d.classList.toggle('on2', k <= beat));
    notesEl.innerHTML = SCRIPT[beat];
    capEl.classList.add('swap');
    clearTimeout(capTimer);
    capTimer = setTimeout(() => { capEl.innerHTML = cur.cap; capEl.classList.remove('swap'); }, 140);
  }

  function advance(){ if(beat < N-1){ beat++; render(); } }
  function goBack(){ if(beat > 0){ beat--; render(); } }
  function jump(b){
    beat = Math.max(0, Math.min(N-1, b));
    document.body.classList.add('settling');
    render();
    clearTimeout(capTimer); capEl.innerHTML = BEATS[beat].cap; capEl.classList.remove('swap');
    void document.body.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('settling')));
  }

  document.body.addEventListener('click', e => { if(!e.target.closest('#notes')) advance(); });
  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); advance(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); goBack(); }
    else if(e.key === 'n' || e.key === 'N'){ notesEl.classList.toggle('on'); }
    else if(e.key === 'r' || e.key === 'R'){ jump(0); }
  });

  window[SLIDE_NAME] = {
    advance, back: goBack,
    atStart: () => beat === 0, atEnd: () => beat === N-1,
    reset: () => jump(0), resetToEnd: () => jump(N-1),
    getBeat: () => beat, count: () => N, setBeat: jump,
  };
  jump(0);
})();
</script>
</body>
</html>
