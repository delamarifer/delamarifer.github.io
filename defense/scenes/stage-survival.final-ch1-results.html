<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which stages survive where</title>
<style>
  :root{
    --bg:#ffffff; --ink:#0f172a; --body:#334155; --muted:#64748b;
    --border:#e2e8f0; --panel:#f8fafc;
    --blue:#38506e; --purple:#7a5ea0; --green:#3f7357; --amber:#b45309; --red:#dc2626;
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--body); font-family:var(--sans);
    display:flex; flex-direction:column; overflow:hidden;
    cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  #stage{ flex:1 1 auto; min-height:0; position:relative;
          display:flex; align-items:center; justify-content:center; padding:2vh 3vw 0; }
  svg{ width:min(100%,1220px); height:auto; max-height:82vh; overflow:visible; }

  #kicker{ font-size:clamp(11px,1.02vw,14px); font-weight:700; letter-spacing:.11em;
           text-transform:uppercase; color:var(--muted); }
  text{ font-family:var(--sans); }
  .regionhd{ font-size:15px; font-weight:700; fill:var(--ink); }
  .stagelab{ font-size:14px; font-weight:600; fill:var(--ink); }
  .modellab{ font-size:12.5px; font-weight:700; fill:var(--muted);
             letter-spacing:.07em; text-transform:uppercase; }
  .tick{ font-size:11.5px; fill:var(--muted); }
  .val{ font-size:12px; font-weight:700; }

  .fade{ transition:opacity .55s ease; }

  footer{ flex:0 0 auto; padding:.6rem 3vw 1.1rem; display:flex;
          justify-content:space-between; align-items:flex-end; gap:2rem; }
  #cap{ font-size:clamp(13px,1.45vw,21px); font-weight:500; color:var(--ink);
        letter-spacing:-.01em; line-height:1.3; max-width:62vw;
        transition:opacity .3s ease, transform .3s ease; }
  #cap.swap{ opacity:0; transform:translateY(6px); }
  #dots{ display:flex; gap:.42rem; flex:0 0 auto; padding-bottom:.35em; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#fff;
        border:1.5px solid #cbd5e1; transition:background .2s, border-color .2s; }
  .dot.on{ background:var(--ink); border-color:var(--ink); }

  #prov{ position:absolute; right:3vw; bottom:.2em; font-size:11px; font-style:italic;
         color:var(--amber); }

  #notes{
    position:fixed; inset:auto 0 0 0; max-height:52vh; overflow:auto;
    background:#0f172a; color:#e2e8f0; padding:1.5rem 3vw 2rem;
    font-size:15px; line-height:1.6; display:none; cursor:default;
  }
  #notes.on{ display:block; }
  #notes b{ color:#fff; }
</style>
</head>
<body>

<div id="stage"><svg id="fig" viewBox="0 0 1220 500" role="img"
  aria-label="Divergence for seven model stages across three cortical regions, each read against that region's reliability floor"></svg></div>

<footer>
  <p id="cap"></p>
  <div id="dots"></div>
</footer>
<div id="prov"></div>
<div id="notes"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Slide 37, "which stages survive where", drawn as what it actually is: a
// divergence value per cell, read against that region's reliability floor.
//
// A tick-and-cross table would be easier and would throw away the two things the
// argument rests on — HOW FAR above the floor a ruled-out stage sits, and the fact
// that the floor itself is higher in higher-order cortex than in the core. Both are
// visible here at a glance and neither survives binarization.
// ─────────────────────────────────────────────────────────────────────────────

const SLIDE_NAME = 'stageSurvival';

// ══ PROVISIONAL — replace from Table S3 before the defense ═══════════════════
// The floor band is the test-retest divergence: a natural sound against itself.
// These three numbers are placeholders consistent with what the outline states
// (higher-order filter bank ≈ 0.70 with a 0.34 gap to robust L4 puts the
// higher-order floor near 0.36), but they are NOT read off the real table yet.
// Everything else below is quoted from the Sept 6 outline.
const FLOOR = { core:0.22, mid:0.30, high:0.36 };
const FLOOR_HALFWIDTH = 0.05;
const FLOOR_PROVISIONAL = true;
// ═════════════════════════════════════════════════════════════════════════════

const REGIONS = [
  {key:'core', label:'Core',         sub:'A1, LBelt, PBelt'},
  {key:'mid',  label:'Mid',          sub:'MBelt, A4, TA2'},
  {key:'high', label:'Higher-order', sub:'A5, STSda, STSdp'},
];

// state: 'floor'   at the floor — compatible. Drawn as a whisker across the band,
//                  because "at floor" is a region, not a point estimate.
//        'above'   above the floor, value not yet quoted. Drawn as an arrow, so it
//                  never pretends to a position it does not have.
//        'value'   a quoted number.
//        'flagged' pending the synthesis audit. No claim drawn at all.
const STAGES = [
  {key:'fb',    model:'Filter bank',      stage:'modulation filters', group:0,
   core:{s:'floor'},   mid:{s:'above'},    high:{s:'value', v:0.70, approx:true}},
  {key:'sL2',   model:'Standard network', stage:'layer 2', group:1,
   core:{s:'flagged'}, mid:{s:'flagged'},  high:{s:'flagged'}},
  {key:'sL3',   model:'Standard network', stage:'layer 3', group:1,
   core:{s:'floor'},   mid:{s:'floor'},    high:{s:'value', v:0.48, approx:true}},
  {key:'sL4',   model:'Standard network', stage:'layer 4', group:1,
   core:{s:'value', v:0.98, approx:true}, mid:{s:'value', v:0.98, approx:true},
   high:{s:'value', v:0.98, approx:true}},
  {key:'rL2',   model:'Robust network',   stage:'layer 2', group:2,
   core:{s:'floor'},   mid:{s:'floor'},    high:{s:'floor'}},
  {key:'rL3',   model:'Robust network',   stage:'layer 3', group:2,
   core:{s:'floor'},   mid:{s:'floor'},    high:{s:'floor'}},
  {key:'rL4',   model:'Robust network',   stage:'layer 4', group:2,
   core:{s:'floor'},   mid:{s:'floor'},    high:{s:'floor'}},
];

// ── geometry ────────────────────────────────────────────────────────────────
const W = 1220, H = 500;
const LEFT = 218, TOP = 92, ROW_H = 52, COL_W = 300, COL_GAP = 34;
const AX_W = COL_W - COL_GAP;
const colX = i => LEFT + i*COL_W;
const rowY = i => TOP + i*ROW_H + ROW_H/2;
const vx = (i, v) => colX(i) + Math.max(0, Math.min(1, v)) * AX_W;

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('fig');
const mk = (t, a={}) => { const e = document.createElementNS(NS, t);
  for(const k in a) e.setAttribute(k, a[k]); return e; };

// ── static scaffold ─────────────────────────────────────────────────────────
const gAxis = mk('g'), gFloor = mk('g', {class:'fade'}), gRows = mk('g');
svg.append(gAxis, gFloor, gRows);

REGIONS.forEach((r, i) => {
  const x0 = colX(i);
  const hd = mk('text', {x:x0, y:32, class:'regionhd'}); hd.textContent = r.label;
  const sb = mk('text', {x:x0, y:49, class:'tick'}); sb.textContent = r.sub;
  gAxis.append(hd, sb);
  // the axis: 0 = identical, 1 = unrelated. The words ride on the tick labels of the
  // first column only — spelling them out over every column is noise, and a separate
  // row of them collides with the region subtitles.
  gAxis.append(mk('line', {x1:x0, y1:TOP-14, x2:x0+AX_W, y2:TOP-14,
                           stroke:'#cbd5e1', 'stroke-width':1}));
  const LAB = i === 0 ? {0:'0  identical', 1:'1  unrelated'} : {0:'0', 1:'1'};
  [0, 0.5, 1].forEach(v => {
    const x = vx(i, v);
    gAxis.append(mk('line', {x1:x, y1:TOP-18, x2:x, y2:TOP-10, stroke:'#cbd5e1','stroke-width':1}));
    if(LAB[v]){
      const anchor = v === 0 ? 'start' : 'end';
      const t = mk('text', {x, y:TOP-23, class:'tick', 'text-anchor':anchor});
      t.textContent = LAB[v]; gAxis.append(t);
    }
    gAxis.append(mk('line', {x1:x, y1:TOP-10, x2:x, y2:TOP+STAGES.length*ROW_H,
                             stroke:'#eef2f6', 'stroke-width':1}));
  });
});

// floor bands, one per region — deliberately different widths across regions,
// because that difference is itself a result (the core cannot separate models)
REGIONS.forEach((r, i) => {
  const f = FLOOR[r.key];
  const xa = vx(i, f - FLOOR_HALFWIDTH), xb = vx(i, f + FLOOR_HALFWIDTH);
  gFloor.append(mk('rect', {x:xa, y:TOP-8, width:xb-xa, height:STAGES.length*ROW_H+4,
                            fill:'#e6f0ea', stroke:'#3f7357', 'stroke-width':1,
                            'stroke-dasharray':'3 3', rx:4, opacity:.9}));
  const t = mk('text', {x:(xa+xb)/2, y:TOP+STAGES.length*ROW_H+22,
                        class:'tick', 'text-anchor':'middle', fill:'#3f7357'});
  t.textContent = 'floor'; gFloor.append(t);
});

// rows: label + one mark per region
const rowG = {}, markG = {};
STAGES.forEach((st, ri) => {
  const g = mk('g', {class:'fade'}); gRows.append(g); rowG[st.key] = g;
  const y = rowY(ri);
  // Model name once per group, stage name on every row. A stage label always sits
  // on its own row's centre line; the model name rides above the first of its group.
  const firstOfGroup = ri === 0 || STAGES[ri-1].group !== st.group;
  if(firstOfGroup){
    const m = mk('text', {x:14, y:y-9, class:'modellab'}); m.textContent = st.model;
    g.append(m);
  }
  const s = mk('text', {x:14, y:firstOfGroup ? y+11 : y+5, class:'stagelab'});
  s.textContent = st.stage; g.append(s);
  g.append(mk('line', {x1:0, y1:y+ROW_H/2-2, x2:W, y2:y+ROW_H/2-2,
                       stroke:'#f1f5f9', 'stroke-width':1}));

  markG[st.key] = REGIONS.map((r, ci) => {
    const mg = mk('g', {class:'fade'}); g.append(mg);
    draw(mg, st[r.key], ci, y, FLOOR[r.key]);
    return mg;
  });
});

// One cell. The shape carries the epistemic status — a whisker is a range, an
// arrow is a direction without a value, a hatch is "we are not claiming anything".
function draw(g, cell, ci, y, floor){
  const inBand = cell.s === 'floor';
  if(cell.s === 'flagged'){
    const x = vx(ci, floor);
    g.append(mk('rect', {x:x-16, y:y-9, width:32, height:18, rx:4,
                         fill:'none', stroke:'#b45309', 'stroke-width':1.4,
                         'stroke-dasharray':'3 2'}));
    const t = mk('text', {x:x+24, y:y+4, class:'val', fill:'#b45309'});
    t.textContent = 'flagged'; g.append(t);
    return;
  }
  if(inBand){
    const xa = vx(ci, floor - FLOOR_HALFWIDTH), xb = vx(ci, floor + FLOOR_HALFWIDTH);
    g.append(mk('line', {x1:xa, y1:y, x2:xb, y2:y, stroke:'#3f7357', 'stroke-width':2.4,
                         'stroke-linecap':'round'}));
    g.append(mk('circle', {cx:(xa+xb)/2, cy:y, r:6, fill:'#3f7357'}));
    const t = mk('text', {x:xb+10, y:y+4, class:'val', fill:'#3f7357'});
    t.textContent = 'at floor'; g.append(t);
    return;
  }
  if(cell.s === 'above'){
    const xa = vx(ci, floor + FLOOR_HALFWIDTH);
    g.append(mk('line', {x1:xa+4, y1:y, x2:xa+44, y2:y, stroke:'#b45309', 'stroke-width':2.2}));
    g.append(mk('polygon', {points:`${xa+44},${y-5} ${xa+56},${y} ${xa+44},${y+5}`,
                            fill:'#b45309'}));
    const t = mk('text', {x:xa+64, y:y+4, class:'val', fill:'#b45309'});
    t.textContent = 'above floor'; g.append(t);
    return;
  }
  // a quoted value: stem from the floor edge out to where it actually lands
  const xf = vx(ci, floor + FLOOR_HALFWIDTH), x = vx(ci, cell.v);
  g.append(mk('line', {x1:xf, y1:y, x2:x, y2:y, stroke:'#dc2626', 'stroke-width':2,
                       opacity:.55}));
  g.append(mk('circle', {cx:x, cy:y, r:6.5, fill:'#dc2626'}));
  const t = mk('text', {x:x - 12, y:y+4, class:'val', fill:'#dc2626', 'text-anchor':'end'});
  t.textContent = (cell.approx ? '~' : '') + cell.v.toFixed(2); g.append(t);
}

// ── beats ───────────────────────────────────────────────────────────────────
// ACT 0 — THE AXIS   (0)   what a divergence value is: 0 identical, 1 unrelated
// ACT 1 — THE FLOOR  (1)   even a perfect model lands here, and it is not the same
//                          height in every region
// ACT 2 — CALIBRATE  (2)   the filter bank reproduces its own 2018 dissociation
// ACT 3 — STANDARD   (3-5) layer 2 flagged, layer 3 splits, layer 4 collapses
// ACT 4 — ROBUST     (6)   nine cells, all inside the band
// ACT 5 — THE READ   (7)   one clean block, and it is the robust network's
const BEATS = [
  { cap:'Divergence: 0 if cortex cannot tell the two sounds apart, 1 if unrelated',
    floor:false, rows:[] },
  { cap:'Even a perfect model lands above zero — that floor is the sound against itself',
    floor:true, rows:[] },
  { cap:'R1. The filter bank: at the floor in the core, far above it beyond',
    floor:true, rows:['fb'] },
  { cap:'The standard network’s layer 2 is flagged, pending the synthesis audit',
    floor:true, rows:['fb','sL2'] },
  { cap:'Layer 3 holds in the core and mid, and separates in higher-order',
    floor:true, rows:['fb','sL2','sL3'] },
  { cap:'Layer 4 collapses — near unrelated everywhere, including the core',
    floor:true, rows:['fb','sL2','sL3','sL4'] },
  { cap:'Every robust stage, in every region, sits inside the floor',
    floor:true, rows:['fb','sL2','sL3','sL4','rL2','rL3','rL4'] },
  { cap:'One model is never ruled out. Every other is ruled out somewhere.',
    floor:true, rows:['fb','sL2','sL3','sL4','rL2','rL3','rL4'], highlight:'rob' },
];
const N = BEATS.length;

const SCRIPT = [
  `<b>The axis.</b> Every cell on this figure is one number: how differently a region responded to a
   natural sound and to the sound matched to it. Zero means the region could not tell them apart at
   all. One means its two responses were unrelated. Low is compatible with the model; high rules it
   out.`,
  `<b>The floor.</b> Nothing lands at zero, not even a perfect model, because the measurement itself
   is noisy — present the same natural sound twice and you get some divergence. That is the band.
   Notice it is not the same height across regions: it is highest in higher-order cortex, where the
   responses are least reliable. Everything is read against the band in its own column, never
   against zero, and never across columns.`,
  `<b>R1, the calibration.</b> The filter bank first, because we already know what it should do. In
   the core its matched sounds are indistinguishable from natural ones — it sits in the band. In
   higher-order cortex it lands at about 0.7, more than twice the floor. That is the 2018
   dissociation, reproduced, before any learned model enters.`,
  `<b>A flag, not a result.</b> The standard network's layer 2 sits above layer 3, which should not
   happen if depth is doing what we think. I am flagging it pending the synthesis audit rather than
   interpreting it, so there is no claim drawn in these three cells.`,
  `<b>Layer 3.</b> At the floor in core and mid — compatible there. In higher-order cortex it
   separates, around 0.48. So this stage is ruled out in higher-order cortex and nowhere else.`,
  `<b>Layer 4 collapses.</b> Near unrelated in all three regions, the core included. This is the
   same stage whose metamers listeners cannot recognize — the network's final representation has
   thrown away something that both cortex and listeners keep.`,
  `<b>The robust network.</b> Nine cells, three stages by three regions, every one inside the band.
   Including higher-order cortex, where the filter bank is ruled out — the gap there is 0.34.`,
  `<b>How to read the whole figure.</b> Scan for rows that are clean all the way across. There is
   one block of them, and it is the robust network's. Every other model is ruled out in at least one
   region. And note what this does not say: sitting at the floor is compatibility, not confirmation.
   A stage that discards very little would also sit at the floor everywhere, which is why I read
   these as which models survive, never which model is right.`,
];

// ── render ──────────────────────────────────────────────────────────────────
const capEl = document.getElementById('cap'), dotsEl = document.getElementById('dots');
const notesEl = document.getElementById('notes'), provEl = document.getElementById('prov');
for(let i=0; i<N; i++){
  const d = document.createElement('div'); d.className = 'dot';
  d.addEventListener('click', e => { e.stopPropagation(); jump(i); });
  dotsEl.appendChild(d);
}

let phase = 0, capTimer = null;
function render(){
  const b = BEATS[phase];
  gFloor.style.opacity = b.floor ? 1 : 0;
  const on = new Set(b.rows);
  STAGES.forEach(st => {
    const shown = on.has(st.key);
    // Accumulate, never replace: earlier rows stay, dimmed, so the last beat shows
    // the whole argument at once.
    const isHot = shown && st.key === b.rows[b.rows.length-1] && !b.highlight;
    const isHi  = b.highlight === 'rob' && st.group === 2;
    rowG[st.key].style.opacity = !shown ? 0 : (b.highlight ? (isHi ? 1 : .32) : (isHot ? 1 : .5));
  });
  provEl.textContent = FLOOR_PROVISIONAL && b.floor
    ? 'floor band provisional — replace from Table S3' : '';
  notesEl.innerHTML = SCRIPT[phase];
  [...dotsEl.children].forEach((d,i) => d.classList.toggle('on', i <= phase));

  capEl.classList.add('swap');
  clearTimeout(capTimer);
  capTimer = setTimeout(() => { capEl.textContent = b.cap; capEl.classList.remove('swap'); }, 140);
}

function advance(){ if(phase >= N-1) return; phase++; render(); }
function goBack(){ if(phase <= 0) return; phase--; render(); }
function jump(p){ phase = Math.max(0, Math.min(N-1, p)); render(); }

addEventListener('click', e => { if(e.target.closest('#dots, #notes')) return; advance(); });
addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); advance(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); goBack(); }
  else if(e.key === 'n' || e.key === 'N'){ notesEl.classList.toggle('on'); }
  else if(e.key === 'r' || e.key === 'R'){ jump(0); }
  else if(e.key >= '1' && e.key <= '9'){ jump(+e.key - 1); }
});

window[SLIDE_NAME] = {
  advance, back: goBack,
  atStart: () => phase === 0,
  atEnd:   () => phase === N-1,
  reset:      () => jump(0),
  resetToEnd: () => jump(N-1),
  getBeat: () => phase,
  count:   () => N,
  setBeat: jump,
};

render();
</script>
</body>
</html>
