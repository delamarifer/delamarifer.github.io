<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A Longer Thank You | Fernanda De La Torre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Figtree:wght@400;500&display=swap">
<style>
:root{--bg:#f6f5fb;--ink:#1f1b3a;--muted:#6a6688;--accent:#a81d68}
@media (prefers-color-scheme: dark){:root{--bg:#141228;--ink:#ece9fb;--muted:#a29ec2;--accent:#f47db8}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,serif;display:grid;place-items:center;padding:24px}
main{max-width:34ch;text-align:center}
h1{font-weight:400;font-size:clamp(34px,7vw,56px);line-height:1.1;margin:0 0 18px;text-wrap:balance}
h1 em{color:var(--accent)}
p{font-size:20px;line-height:1.6;margin:0 0 14px}
.soon{font-family:"Figtree",system-ui,sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
.small{font-family:"Figtree",system-ui,sans-serif;font-size:14px;color:var(--muted);margin-top:28px}
</style>
</head>
<body>
<main>
<div class="soon">Coming soon</div>
<h1>A longer <em>thank you</em></h1>
<p>The acknowledgments in my thesis could not hold everything I wanted to say. A longer note for each person will live here.</p>
<p class="small">Fernanda De La Torre, PhD thesis, MIT Brain and Cognitive Sciences, 2026</p>
</main>
</body>
</html>
